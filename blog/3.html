<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読み込み中...</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="index.html">{name}の雑記ブログ</a></h1>
            <div class="search-container">
                <input type="text" placeholder="ブログ内を検索..." id="search-input">
                <button type="button" id="search-btn">検索</button>
            </div>
        </header>

        <div class="breadcrumb">
            <a href="index.html">← ブログトップへ戻る</a>
        </div>

        <main>
            <article class="post-article">
                <div class="post-meta" id="js-meta"></div>
                <h1 class="post-title" id="js-title"></h1>
                <div class="post-body" id="js-body"></div>
            </article>

            <div class="reaction-area">
                <button type="button" class="reaction-btn">👍 高評価 (<span id="js-likes">0</span>)</button>
                <button type="button" class="reaction-btn">👎 低評価 (<span id="js-dislikes">0</span>)</button>
            </div>

            <div class="post-navigation" id="js-nav"></div>

            <section class="comment-area">
                <h3>コメント</h3>
                <ul class="comment-list" id="js-comment-list"></ul>
            </section>
        </main>

        <footer>
            <p>&copy; {name}の雑記ブログ All Rights Reserved.</p>
        </footer>
    </div>
    <script src="scripts/main.js"></script>
    <script src="scripts/search.js"></script>
    <script>article(3);</script>
</body>
</html>
