<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - {name}の雑記ブログ</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー（検索後、さらに再検索も可能） -->
        <header>
            <h1><a href="index.html">中2の雑記ブログ</a></h1>
            <div class="search-container">
                <input type="text" placeholder="ブログ内を検索..." id="search-input">
                <button type="button" id="search-btn">検索</button>
            </div>
        </header>

        <div class="breadcrumb">
            <a href="index.html">← ブログトップへ戻る</a>
        </div>

        <!-- 検索結果の挿入先 -->
        <main id="search-results">
            <p>検索しています...</p>
        </main>

        <footer>
            <p>&copy; 中2の雑記ブログ All Rights Reserved.</p>
        </footer>
    </div>

    <!-- main.jsを先に読み込んでarticles配列を使えるようにする -->
    <script src="scripts/main.js"></script>
    <script src="scripts/search.js"></script>
    <script>
        // URLの ?q= の値を取得して検索を実行
        (function() {
            const params = new URLSearchParams(window.location.search);
            const query = params.get("q") ? params.get("q").trim().toLowerCase() : "";
            const resultContainer = document.getElementById("search-results");

            if (!resultContainer) return;

            if (!query) {
                resultContainer.innerHTML = "<p>検索キーワードが指定されていません。</p>";
                return;
            }

            // 0.html（隠し要素）も含めて検索
            const results = articles.filter(a => 
                a.title.toLowerCase().includes(query) || 
                a.summary.toLowerCase().includes(query) || 
                a.content.toLowerCase().includes(query)
            );

            resultContainer.innerHTML = `<h3>「${params.get("q")}」の検索結果 (${results.length}件)</h3>`;

            if (results.length === 0) {
                resultContainer.insertAdjacentHTML("beforeend", "<p>一致する記事が見つかりませんでした。</p>");
                return;
            }

            results.forEach(item => {
                const articleHtml = `
                    <article class="post-item">
                        <div class="post-meta">${item.date}</div>
                        <h2 class="post-title"><a href="${item.id}.html">${item.title}</a></h2>
                        <div class="post-content"><p>${item.summary}</p></div>
                        <div class="post-footer"><a href="${item.id}.html" class="read-more-btn">続きを読む →</a></div>
                    </article>
                `;
                resultContainer.insertAdjacentHTML("beforeend", articleHtml);
            });
        })();
    </script>
</body>
</html>
