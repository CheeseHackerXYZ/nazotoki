<style>
/* Layout: 3D view on top, a fixed bottom panel holding the minimap (centre) and touch controls (sides). */
:root {

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);

}
#app {
  height: 100%;

}
#view { position: relative; min-height: 0; overflow: hidden; touch-action: none; background: #000; }

.screen {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="gen">
const mapAreaSize = 3;
const mapPartSize = 15;
const seeds = [114,514,364,721,810,1919,8315,114514,101000818];
const types = ['wall','road','room','door1','door2'];
const mapArea = [];
let roomIndex = 0;

for (let i = 0; i < mapAreaSize ** 2; i++) {
    let hasTop = !(i < mapAreaSize);
    let hasRight = !(i % mapAreaSize == mapAreaSize - 1);
    let hasBottom = !(i > mapAreaSize * (mapAreaSize - 1) - 1);
    let hasLeft = !(i % mapAreaSize == 0);
    mapArea.push(generateMapPart(seeds[i], mapPartSize, hasTop, hasRight, hasBottom, hasLeft))
}

const map = combine(mapArea, mapPartSize, mapAreaSize)


function generateMapPart(seed, size, hasTop, hasRight, hasBottom, hasLeft) {
    const TL = types.length;
    const s = seed;
    const sz = size;
    let mapPart = Array(sz).fill(0).map(() => Array(sz).fill(0));

    // 道作成
    const cross1X = $RN(s, 0, sz - 2) + 1;
    const cross1Y = $RN(s, 1, sz - 2) + 1;
    const cross2X = $RN(s, 2, sz - 2) + 1;
    const cross2Y = $RN(s, 3, sz - 2) + 1;

    mapPart[cross1Y][cross1X] = 1;
    mapPart[cross2Y][cross2X] = 1;

    const createStreet = (fromX, fromY, toX, toY, index) => {
        let currentX = fromX;
        let currentY = fromY;

        let diffX = Math.abs(toX - fromX);
        let diffY = Math.abs(toY - fromY);
        const signX = Math.sign(toX - fromX);
        const signY = Math.sign(toY - fromY);

        const diffSum = diffX + diffY;
        const checkValid = (nextX, nextY) => {
            if (nextX === toX && nextY === toY) return true;
            if (nextX === 0 || nextX === sz - 1 || nextY === 0 || nextY === sz - 1) {
                return false;
            }
            return true;
        };

        const moveX = () => {
            diffX -= 1;
            currentX += signX;
            mapPart[currentY][currentX] = 1;
        };
        const moveY = () => {
            diffY -= 1;
            currentY += signY;
            mapPart[currentY][currentX] = 1;
        };

        for (let i = 0; i < diffSum; i++) {
            if (diffX === 0) { moveY(); continue; }
            if (diffY === 0) { moveX(); continue; }

            const nextX = currentX + signX;
            const nextY = currentY + signY;

            const ableX = checkValid(nextX, currentY);
            const ableY = checkValid(currentX, nextY);

            if (!ableX && ableY) { moveY(); continue; }
            if (!ableY && ableX) { moveX(); continue; }

            const random = $R(seed, index * 100 + i);
            if (random < 0.5) {
                moveX();
            } else {
                moveY();
            }
        }
    };

    createStreet(cross1X, cross1Y, cross2X, cross2Y, 0);

    const h = (sz - 1) / 2;
    let [topX, topY, rightX, rightY, bottomX, bottomY, leftX, leftY] = [h, 0, sz - 1, h, h, sz - 1, 0, h];

    const checkDist = (x, y) => {
        let dist1 = Math.abs(cross1X - x) + Math.abs(cross1Y - y);
        let dist2 = Math.abs(cross2X - x) + Math.abs(cross2Y - y);
        let dist = Math.min(dist1, dist2);
        if (dist1 < dist2) {
            return [1, dist];
        } else {
            return [2, dist];
        }
    };

    const [topNear, distTop] = checkDist(topX, topY);
    const [rightNear, distRight] = checkDist(rightX, rightY);
    const [bottomNear, distBottom] = checkDist(bottomX, bottomY);
    const [leftNear, distLeft] = checkDist(leftX, leftY);

    const directions = [
        { dist: distTop, has: hasTop, near: topNear, posX: topX, posY: topY, index: 1 },
        { dist: distRight, has: hasRight, near: rightNear, posX: rightX, posY: rightY, index: 2 },
        { dist: distBottom, has: hasBottom, near: bottomNear, posX: bottomX, posY: bottomY, index: 3 },
        { dist: distLeft, has: hasLeft, near: leftNear, posX: leftX, posY: leftY, index: 4 }
    ];
    directions.sort((a, b) => (a.dist - b.dist));
    directions.forEach(dir => {
        if (dir.has) {
            let [crossX, crossY] = dir.near === 1 ? [cross1X, cross1Y] : [cross2X, cross2Y];
            createStreet(crossX, crossY, dir.posX, dir.posY, 1);
        }
    });
    // 部屋とドアの配置
    function generateRooms(targetRoomCount = 2, roomSize, maxTrials = 100) {
        let roomCount = 0;
        let trial = 0;

        const overlapRoadMax = roomSize ** 2 / 3;
        const roomAreaMin = (roomSize ** 2 / 3) * 2;

        while (roomCount < targetRoomCount && trial < maxTrials) {
            const rx = $RN(seed, trial * 10 + 1, sz - roomSize);
            const ry = $RN(seed, trial * 10 + 2, sz - roomSize);
            const rw = roomSize;
            const rh = roomSize;

            // この部屋用の基本値（エンコード用）
            const currentRoomId = roomIndex + 1;
            const roomValue = currentRoomId * TL + 2;        // 属性: 2 (部屋)
            const doorSingleValue = currentRoomId * TL + 3;  // 属性: 3 (1連ドア)
            const doorDoubleValue = currentRoomId * TL + 4;  // 属性: 4 (2連ドア)

            let canPlace = true;
            let overlapRoadCount = 0;

            for (let y = ry; y < ry + rh; y++) {
                for (let x = rx; x < rx + rw; x++) {
                    const tileType = mapPart[y][x] % TL;
                    if (tileType === 1) overlapRoadCount++;
                    if (tileType === 2) canPlace = false; // すでに部屋がある
                }
            }

            if (!canPlace || overlapRoadCount > overlapRoadMax) {
                trial++;
                continue;
            }

            let roomTiles = [];
            for (let y = ry; y < ry + rh; y++) {
                for (let x = rx; x < rx + rw; x++) {
                    if (mapPart[y][x] === 0) {
                        mapPart[y][x] = roomValue;
                        roomTiles.push({ x, y });
                    }
                }
            }

            if (roomTiles.length < roomAreaMin) {
                roomTiles.forEach(t => mapPart[t.y][t.x] = 0);
                trial++;
                continue;
            }

            // 部屋がつながっているかの確認
            const dirVectors = [{x:0, y:-1}, {x:1, y:0}, {x:0, y:1}, {x:-1, y:0}];
            const isConnected = () => {
                const visited = new Set();
                const queue = [roomTiles[0]];
                visited.add(`${roomTiles[0].x},${roomTiles[0].y}`);
                let reachedCount = 0;

                while (queue.length > 0) {
                    const current = queue.shift();
                    reachedCount++;
                    for (const d of dirVectors) {
                        const nx = current.x + d.x;
                        const ny = current.y + d.y;
                        const key = `${nx},${ny}`;

                        if (nx >= 0 && nx < sz && ny >= 0 && ny < sz) {
                            // 同じ部屋のマスかを判定
                            if (mapPart[ny][nx] === roomValue && !visited.has(key)) {
                                visited.add(key);
                                queue.push({ x: nx, y: ny });
                            }
                        }
                    }
                }
                return reachedCount === roomTiles.length;
            };

            if (!isConnected()) {
                roomTiles.forEach(t => mapPart[t.y][t.x] = 0);
                trial++;
                continue;
            }

            // ドアの配置候補抽出
            const candidateSingleDoors = [];

            roomTiles.forEach(tile => {
                let roadNeighborCount = 0;
                let roadDir = null;
                dirVectors.forEach(d => {
                    const nx = tile.x + d.x;
                    const ny = tile.y + d.y;
                    if (nx >= 0 && nx < sz && ny >= 0 && ny < sz) {
                        // 道路(属性1)に接しているかを判定
                        if (mapPart[ny][nx] % TL === 1) {
                            roadNeighborCount++;
                            roadDir = d;
                        }
                    }
                });

                if (roadNeighborCount === 1) {
                    candidateSingleDoors.push({ tile, dir: roadDir });
                }
            });

            if (candidateSingleDoors.length === 0) {
                roomTiles.forEach(t => mapPart[t.y][t.x] = 0);
                trial++;
                continue;
            }

            // 2連ドアの探索
            const candidateDoubleDoors = [];
            for (let i = 0; i < candidateSingleDoors.length; i++) {
                for (let j = i + 1; j < candidateSingleDoors.length; j++) {
                    const d1 = candidateSingleDoors[i];
                    const d2 = candidateSingleDoors[j];
                    if (d1.dir.x === d2.dir.x && d1.dir.y === d2.dir.y) {
                        const dist = Math.abs(d1.tile.x - d2.tile.x) + Math.abs(d1.tile.y - d2.tile.y);
                        if (dist === 1) {
                            candidateDoubleDoors.push([d1.tile, d2.tile]);
                        }
                    }
                }
            }

            if (candidateDoubleDoors.length > 0) {
                // 2連ドア配置
                const pairIdx = Math.floor($R(seed, trial * 10 + 3) * candidateDoubleDoors.length);
                const [t1, t2] = candidateDoubleDoors[pairIdx];

                mapPart[t1.y][t1.x] = doorDoubleValue;
                mapPart[t2.y][t2.x] = doorDoubleValue;
            } else {
                // 普通のドア配置
                const doorIdx = Math.floor($R(seed, trial * 10 + 3) * candidateSingleDoors.length);
                const selectedDoor = candidateSingleDoors[doorIdx];

                mapPart[selectedDoor.tile.y][selectedDoor.tile.x] = doorSingleValue;
            }

            roomCount++;
            roomIndex++; // 全体の累積部屋数インデックスを加算
            trial++;
        }

        return mapPart;
    }

    generateRooms(2, 5, 100);
    generateRooms(2, 4, 100);
    return mapPart;
}
function $R(seed, index) {
    let hash = Math.sin(seed * 9999 + index * 7777) * 10000;
    return hash - Math.floor(hash);
}

function $RN(seed,index,num) {
    return Math.floor($R(seed,index) * num);
}

function combine(mapArea, mapPartSize, mapAreaSize) {
    const totalSize = mapPartSize * mapAreaSize; // 15 * 3 = 45
    const map = Array(totalSize).fill(0).map(() => Array(totalSize).fill(0));

    for (let areaIndex = 0; areaIndex < mapArea.length; areaIndex++) {
        const areaX = areaIndex % mapAreaSize;
        const areaY = Math.floor(areaIndex / mapAreaSize);

        const part = mapArea[areaIndex];

        for (let py = 0; py < mapPartSize; py++) {
            for (let px = 0; px < mapPartSize; px++) {
                const mapY = areaY * mapPartSize + py;
                const mapX = areaX * mapPartSize + px;
                map[mapY][mapX] = part[py][px];
            }
        }
    }

    return map;
}
</script>

<script id="game">
(() => {
'use strict';
const $ = id => document.getElementById(id);
const T = types.length, CS = 2, WH = 2.5, N = map.length;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const walk = (x, y) => x >= 0 && y >= 0 && x < N && y < N && map[y][x] % T !== 0;
const kind = (x, y) => map[y][x] % T;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

/* ---------- grid helpers ---------- */
function bfsField(sx, sy) {
  const d = new Int16Array(N * N).fill(-1);
  const q = new Int32Array(N * N);
  let h = 0, t = 0;
  d[sy * N + sx] = 0; q[t++] = sy * N + sx;
  while (h < t) {
    const c = q[h++], cx = c % N, cy = (c / N) | 0, dc = d[c];
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (walk(nx, ny) && d[ny * N + nx] < 0) { d[ny * N + nx] = dc + 1; q[t++] = ny * N + nx; }
    }
  }
  return d;
}
const comp = new Int16Array(N * N).fill(-1);
let mainComp = -1, mainSize = 0, nComp = 0;
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  if (!walk(x, y) || comp[y * N + x] >= 0) continue;
  const f = bfsField(x, y); let size = 0;
  for (let i = 0; i < N * N; i++) if (f[i] >= 0) { comp[i] = nComp; size++; }
  if (size > mainSize) { mainSize = size; mainComp = nComp; }
  nComp++;
}
const mainCells = [];
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (walk(x, y) && comp[y * N + x] === mainComp) mainCells.push([x, y]);

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: !isTouch });
} catch (e) {
  $('s-title').innerHTML = '<h2 class="result">表示できません</h2><p class="info">このブラウザでは WebGL が使えません。</p>';
  return;
}

/* ---------- audio ---------- */
let AC = null, master = null, droneGain = null, soundOn = true, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 0.9 : 0; master.connect(AC.destination);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 150;
    droneGain = AC.createGain(); droneGain.gain.value = 0.14;
    [43, 43.8, 64.6].forEach((fr, i) => {
      const o = AC.createOscillator(); o.type = i === 2 ? 'sine' : 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start();
    });
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.07;
    const lg = AC.createGain(); lg.gain.value = 50; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(droneGain); droneGain.connect(master);
  } catch (e) { AC = null; }
}
function noise() {
  if (!noiseBuf) {
    const n = Math.floor(AC.sampleRate * 0.3);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function stepSnd(vol, pan, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource();
  s.buffer = noise();
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  s.connect(f); f.connect(g);
  if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(master); } else g.connect(master);

}

  o.type = 'sine'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(36, t + 0.13);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
}

  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function scare() {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(880, t + 0.25); o.frequency.exponentialRampToValueAtTime(300, t + 0.9);
  f.type = 'bandpass'; f.frequency.value = 1200;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 1);

/* ---------- game state ---------- */
const player = { x: 0, z: 0, yaw: 0, pitch: 0, stamina: 1, exhausted: false };
const en = { x: 0, z: 0, mode: 'patrol', field: null, timer: 0, stepT: 0, rot: 0 };
let state = 'title', tPlay = 0, tAll = 0, pField = null, goalCell = [0, 0];

let deadT = 0, hbT = 0, ambT = 8, stepT = 0, bobT = 0, flickT = 0, danger = 0, moveAmt = 0;

function newLevel() {
  let cand = [];
  const lo = Math.floor(N / 3), hi = Math.floor(N * 2 / 3) - 1;
  for (let y = N - 1; y >= 0 && !cand.length; y--)
    for (let x = lo; x <= hi; x++) if (walk(x, y) && comp[y * N + x] === mainComp) cand.push([x, y]);
  const [sx, sy] = pick(cand);
  cand = [];
  for (let y = 0; y < N && !cand.length; y++)
    for (let x = 0; x < N; x++) if (walk(x, y) && comp[y * N + x] === mainComp) cand.push([x, y]);
  const [gx, gy] = pick(cand);
  goalCell = [gx, gy];
  goal.position.set((gx + 0.5) * CS, 0, (gy + 0.5) * CS);

  const ds = bfsField(sx, sy), dg = bfsField(gx, gy);
  const pool = (minS, minG) => mainCells.filter(([x, y]) => ds[y * N + x] >= minS && dg[y * N + x] >= minG);
  let ec = pool(30, 10); if (!ec.length) ec = pool(15, 6); if (!ec.length) ec = mainCells;
  const [ex, ey] = pick(ec);
  en.x = (ex + 0.5) * CS; en.z = (ey + 0.5) * CS; en.mode = 'patrol'; en.field = null; en.timer = 0; en.stepT = 0;

  player.x = (sx + 0.5) * CS; player.z = (sy + 0.5) * CS; player.pitch = 0;
  player.stamina = 1; player.exhausted = false;
  const open = [[0, -1, 0], [1, 0, -Math.PI / 2], [-1, 0, Math.PI / 2], [0, 1, Math.PI]].find(([dx, dy]) => walk(sx + dx, sy + dy));
  player.yaw = open ? open[2] : 0;
  explored = new Uint8Array(N * N);
  pField = bfsField(sx, sy);
  tPlay = 0; deadT = 0; danger = 0; hbT = 0; ambT = 8;
  $('flash').classList.remove('on');
  enemyG.visible = true;
}

const stick = $('stick'), knob = $('knob'), joy = { x: 0, y: 0 };
let stickId = null, sc = { x: 0, y: 0 };
function moveStick(e) {
  const R = stick.clientWidth / 2 - 6;
  let dx = e.clientX - sc.x, dy = e.clientY - sc.y;
  const l = Math.hypot(dx, dy);
  if (l > R) { dx *= R / l; dy *= R / l; }
  joy.x = dx / R; joy.y = dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointerdown', e => {
  stickId = e.pointerId; stick.setPointerCapture(e.pointerId);
  const r = stick.getBoundingClientRect(); sc.x = r.left + r.width / 2; sc.y = r.top + r.height / 2;
  moveStick(e); e.preventDefault();
});
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
const endStick = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; joy.x = joy.y = 0; knob.style.transform = 'translate(0,0)';
};

/* ---------- player ---------- */
const R = 0.42;
function blocked(x, z) {
  return [[-R, -R], [R, -R], [-R, R], [R, R]].some(([ox, oz]) => !walk(Math.floor((x + ox) / CS), Math.floor((z + oz) / CS)));
}
function updatePlayer(dt) {
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  player.yaw += turn * 1.9 * dt;
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const jm = Math.hypot(joy.x, joy.y);
  if (jm > 0.15) { f += -joy.y; s += joy.x; }
  let len = Math.hypot(f, s);
  if (len > 1) { f /= len; s /= len; len = 1; }
  const wantRun = (keys.ShiftLeft || keys.ShiftRight || sprintBtn) && len > 0.2;
  if (player.exhausted && player.stamina > 0.3) player.exhausted = false;
  const running = wantRun && !player.exhausted && player.stamina > 0;
  if (running) {
    player.stamina -= 0.27 * dt;
    if (player.stamina <= 0) { player.stamina = 0; player.exhausted = true; }
  } else player.stamina = Math.min(1, player.stamina + (len > 0.2 ? 0.14 : 0.3) * dt);
  const speed = (running ? 5.6 : 3.4) * len;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const vx = (-sy * f + cy * s) * (running ? 5.6 : 3.4);
  const vz = (-cy * f - sy * s) * (running ? 5.6 : 3.4);
  let nx = player.x + vx * dt;
  if (!blocked(nx, player.z)) player.x = nx;
  let nz = player.z + vz * dt;
  if (!blocked(player.x, nz)) player.z = nz;
  moveAmt = speed;
  if (speed > 0.3) {
    bobT += speed * dt * 2.1;
    stepT -= dt * speed / 3.4;
    if (stepT <= 0) { stepT = 0.5; stepSnd(running ? 0.22 : 0.14, 0, 380); }
  }
  // reveal map near the player
  const pcx = Math.floor(player.x / CS), pcy = Math.floor(player.z / CS);
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
    if (dx * dx + dy * dy <= 5 && walk(pcx + dx, pcy + dy)) explored[(pcy + dy) * N + pcx + dx] = 1;
  for (const [dx, dy] of DIRS) for (let k = 1; k <= 6; k++) {
    const x = pcx + dx * k, y = pcy + dy * k;
    if (!walk(x, y)) break;
    explored[y * N + x] = 1;
  }
}

/* ---------- enemy ---------- */
function updateEnemy(dt) {
  if (tPlay < 4) return;
  en.timer -= dt;
  const ecx = clamp(Math.floor(en.x / CS), 0, N - 1), ecy = clamp(Math.floor(en.z / CS), 0, N - 1);
  const dEuc = Math.hypot(player.x - en.x, player.z - en.z);
  if (en.timer <= 0) {
    en.timer = 0.3;
    pField = bfsField(clamp(Math.floor(player.x / CS), 0, N - 1), clamp(Math.floor(player.z / CS), 0, N - 1));
    const dp = pField[ecy * N + ecx];
    if (en.mode === 'patrol' && ((dp >= 0 && dp <= 12) || dEuc < 5)) en.mode = 'chase';
    else if (en.mode === 'chase' && (dp < 0 || dp > 24) && dEuc > 12) { en.mode = 'patrol'; en.field = null; }
    if (en.mode === 'patrol' && (!en.field || en.field[ecy * N + ecx] <= 1)) {
      for (let i = 0; i < 30; i++) {
        const [tx, ty] = pick(mainCells);
        en.field = bfsField(tx, ty);
        if (en.field[ecy * N + ecx] >= 8) break;
      }
    }
  }
  const chase = en.mode === 'chase';
  const field = chase ? pField : en.field;
  const speed = chase ? 3.9 : 1.8;
  let tx = en.x, tz = en.z;
  if (field) {
    const cur = field[ecy * N + ecx];
    if (cur > 0) {
      let best = cur, bx = -1, by = -1;
      for (const [dx, dy] of DIRS) {
        const nx = ecx + dx, ny = ecy + dy;
        if (!walk(nx, ny)) continue;
        const v = field[ny * N + nx];
        if (v >= 0 && v < best) { best = v; bx = nx; by = ny; }
      }
      if (bx >= 0) { tx = (bx + 0.5) * CS; tz = (by + 0.5) * CS; }
    } else if (chase) { tx = player.x; tz = player.z; }
  }
  const dx = tx - en.x, dz = tz - en.z, dist = Math.hypot(dx, dz);
  if (dist > 0.001) {
    const st = Math.min(dist, speed * dt);
    en.x += dx / dist * st; en.z += dz / dist * st;
    const want = Math.atan2(dx, dz);
    let diff = want - en.rot; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    en.rot += diff * Math.min(1, dt * 7);
    en.stepT -= dt * speed / 2;
    if (en.stepT <= 0 && dEuc < 18) {
      en.stepT = 0.5;
      const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
      const lat = ((en.x - player.x) * rx + (en.z - player.z) * rz) / Math.max(dEuc, 0.01);
      stepSnd(clamp(1 - dEuc / 18, 0, 1) * (chase ? 0.9 : 0.6), lat, 260);
    }
  }
}
function placeEnemy(t) {
  enemyG.position.set(en.x, 0, en.z);
  enemyG.rotation.y = en.rot;
  enemyG.children.forEach((c, i) => { if (c.isMesh && c.geometry.type === 'BoxGeometry' && c.position.y > 1) c.rotation.x = Math.sin(t * 2 + i) * 0.12; });
}

/* ---------- minimap ---------- */
const mm = $('mm'), mctx = mm.getContext('2d');
const MR = 12;
function drawMini(t) {
  const W = mm.width, cell = W / (2 * MR + 1);
  mctx.fillStyle = '#050706'; mctx.fillRect(0, 0, W, W);
  const pcx = player.x / CS, pcz = player.z / CS;
  const bx = Math.floor(pcx), by = Math.floor(pcz);
  for (let dy = -MR - 1; dy <= MR + 1; dy++) for (let dx = -MR - 1; dx <= MR + 1; dx++) {
    const cx = bx + dx, cy = by + dy;
    if (!walk(cx, cy) || !explored[cy * N + cx]) continue;
    const k = kind(cx, cy);
    mctx.fillStyle = k === 1 ? '#3a4a40' : k === 2 ? '#4a4334' : '#9a6a30';
    mctx.fillRect(W / 2 + (cx - pcx) * cell, W / 2 + (cy - pcz) * cell, cell + 0.6, cell + 0.6);
  }
  const [gx, gy] = goalCell;
  if (explored[gy * N + gx]) {
    mctx.fillStyle = `rgba(93,255,160,${0.65 + 0.35 * Math.sin(t * 4)})`;
    mctx.beginPath();
    mctx.arc(W / 2 + (gx + 0.5 - pcx) * cell, W / 2 + (gy + 0.5 - pcz) * cell, cell * 0.55, 0, 6.2832);
    mctx.fill();
  }
  const fx = -Math.sin(player.yaw), fy = -Math.cos(player.yaw), c = W / 2, u = cell;
  mctx.fillStyle = '#ffe6bd';
  mctx.beginPath();
  mctx.moveTo(c + fx * u * 1.5, c + fy * u * 1.5);
  mctx.lineTo(c - fx * u * 0.8 - fy * u * 0.8, c - fy * u * 0.8 + fx * u * 0.8);
  mctx.lineTo(c - fx * u * 0.8 + fy * u * 0.8, c - fy * u * 0.8 - fx * u * 0.8);
  mctx.closePath(); mctx.fill();
}

/* ---------- loop ---------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const p = $('panel'), ph = p.clientHeight, pw = p.clientWidth;
  const s = Math.max(96, Math.floor(Math.min(ph - 20, isTouch ? pw - 32 - 2 * 98 : pw * 0.5)));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mm.style.width = mm.style.height = s + 'px';
  mm.width = mm.height = Math.round(s * dpr);
}
new ResizeObserver(resize).observe($('app'));
resize();

function update(dt) {
  tAll += dt;
  if (state === 'play') {
    tPlay += dt;
    updatePlayer(dt);
    updateEnemy(dt);
    const dEuc = Math.hypot(player.x - en.x, player.z - en.z);
    danger = tPlay < 4 ? 0 : Math.pow(clamp(1 - (dEuc - 1.5) / 11, 0, 1), 1.4);
    if (tPlay >= 4 && dEuc < 0.95) {
      state = 'dead'; deadT = 0; danger = 1; scare();
      $('flash').classList.add('on');
      try { navigator.vibrate && navigator.vibrate([120, 60, 200]); } catch (_) {}
    } else if (Math.hypot(player.x - goal.position.x, player.z - goal.position.z) < 0.9) {
      state = 'clear'; chime();
      $('clear-info').textContent = `脱出までの時間 ${fmt(tPlay)}`;
      showScreen('s-clear');
    }
    $('clock').textContent = fmt(tPlay);
    $('stai').style.transform = `scaleX(${player.stamina.toFixed(3)})`;
    $('sta').classList.toggle('low', player.exhausted || player.stamina < 0.2);
  } else if (state === 'dead') {
    deadT += dt;
    const dx = en.x - player.x, dz = en.z - player.z;
    const want = Math.atan2(-dx, -dz);
    let diff = want - player.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.yaw += diff * Math.min(1, dt * 9);
    player.pitch += (0.1 - player.pitch) * Math.min(1, dt * 6);
    if (deadT > 0.35) $('flash').classList.remove('on');
    if (deadT > 1.3 && $('s-dead').hidden) {
      $('dead-info').textContent = `生き延びた時間 ${fmt(tPlay)}`;
      showScreen('s-dead');
    }
  } else if (state === 'title') {
    player.yaw += Math.sin(tAll * 0.3) * 0.0015;
  }

  // heartbeat, ambience
  if (state === 'play' && AC) {
    if (danger > 0.05) {
      hbT -= dt;
      if (hbT <= 0) {
        const bpm = 62 + 100 * danger;
        hbT = 60 / bpm;
        thump(0.35 + 0.35 * danger); setTimeout(() => thump(0.22 + 0.25 * danger), 170);
      }
    }
    ambT -= dt;
    if (ambT <= 0) {
      ambT = 9 + Math.random() * 13;
      const pan = Math.random() * 2 - 1;
      stepSnd(0.5, pan, 170); setTimeout(() => stepSnd(0.4, pan, 150), 260);
    }
    droneGain.gain.setTargetAtTime(0.13 + 0.2 * danger, AC.currentTime, 0.3);
  }

  // camera, lights
  const moving = state === 'play' ? Math.min(1, moveAmt / 3.4) : 0;
  const shake = danger * 0.025;
  camera.position.set(
    player.x + (Math.random() - 0.5) * shake,
    1.2 + Math.sin(bobT) * 0.035 * moving + (state === 'dead' ? -0.15 * Math.min(1, deadT * 2) : 0),
    player.z + (Math.random() - 0.5) * shake
  );
  camera.rotation.set(player.pitch, player.yaw, 0);
  let flick = 1;
  if (flickT > 0) { flickT -= dt; flick = 0.2 + Math.random() * 0.4; }
  else if (Math.random() < 0.004 + danger * 0.04) flickT = 0.06 + Math.random() * 0.16;
  lamp.position.copy(camera.position); lamp.position.y += 0.1;
  lamp.intensity = 0.6 * flick;
  spot.position.copy(camera.position);
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  spot.target.position.copy(camera.position).addScaledVector(dir, 5);
  spot.intensity = 1.7 * flick;
  goalLight.intensity = 1.1 + 0.4 * Math.sin(tAll * 3);
  beamMat.opacity = 0.3 + 0.1 * Math.sin(tAll * 2.4);
  placeEnemy(tAll);
  view.style.setProperty('--danger', danger.toFixed(3));
  drawMini(tAll);
}

newLevel();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
