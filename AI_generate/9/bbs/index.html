<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名掲示板 - オークション木箱検証スレ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>深層ネット匿名掲示板</h1>
    <p>考察・検証・情報共有</p>
  </header>

  <main class="container">
    <!-- 新規レス投稿フォーム -->
    <div class="post-form-box">
      <div class="form-title">新規書き込み</div>
      <form id="main-post-form">
        <div class="form-group">
          <input type="text" id="main-name" class="input-name" placeholder="名前 (省略可)">
        </div>
        <div class="form-group">
          <textarea id="main-content" class="input-content" rows="3" placeholder="コメントを入力..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">書き込む</button>
      </form>
    </div>

    <!-- 投稿・コメントツリー表示エリア -->
    <div id="posts-container"></div>
  </main>

  <footer class="footer">
    &copy; ANONYMOUS BBS ALL RIGHTS RESERVED.
  </footer>

  <script src="data.js"></script>
  <script src="ui.js"></script>
</body>
</html>
