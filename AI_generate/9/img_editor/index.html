      width: 100%;

    }

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #aaa;
    }
    .control-header .value {
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: #444;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;

      border-radius: 50%;

      cursor: pointer;
    }

      background: transparent;

<body>

  <h1>写真エディター</h1>

  <div class="uploader">
    <label class="upload-btn" for="imageInput">画像を選択</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="image-container">
    <span class="placeholder-text" id="placeholder">画像が選択されていません</span>
    <img id="previewImage" alt="プレビュー">
  </div>

  <div class="controls">
    <div class="control-group">
      <div class="control-header">
        <span>露出</span>
        <span class="value" id="exposureVal">0</span>
      </div>
      <input type="range" id="exposure" min="-100" max="100" value="0">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span>コントラスト</span>
        <span class="value" id="contrastVal">0</span>
      </div>
      <input type="range" id="contrast" min="-100" max="100" value="0">
    </div>

    <button class="reset-btn" id="resetBtn">リセット</button>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');
    const placeholder = document.getElementById('placeholder');
    
    const exposureInput = document.getElementById('exposure');
    const contrastInput = document.getElementById('contrast');
    const exposureVal = document.getElementById('exposureVal');
    const contrastVal = document.getElementById('contrastVal');
    const resetBtn = document.getElementById('resetBtn');

    // 画像読み込み処理
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          previewImage.src = event.target.result;
          previewImage.style.display = 'block';
          placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // フィルター更新処理（CSSの brightness と contrast を使用）
    function updateFilters() {
      const expValue = parseInt(exposureInput.value, 10);
      const conValue = parseInt(contrastInput.value, 10);

      exposureVal.textContent = expValue;
      contrastVal.textContent = conValue;

      // 露出: -100〜100 を CSS brightness (0%〜200%) にマッピング
      const brightnessPercent = 100 + expValue;
      
      // コントラスト: -100〜100 を CSS contrast (0%〜200%) にマッピング
      const contrastPercent = 100 + conValue;

      previewImage.style.filter = `brightness(${brightnessPercent}%) contrast(${contrastPercent}%)`;
    }

    // スライダー操作イベント (input イベントでリアルタイム追従)
    exposureInput.addEventListener('input', updateFilters);
    contrastInput.addEventListener('input', updateFilters);

    // リセット
    resetBtn.addEventListener('click', () => {
      exposureInput.value = 0;
      contrastInput.value = 0;
      updateFilters();
    });
  </script>
