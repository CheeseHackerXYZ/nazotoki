<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メールボックス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mail-container">
    <!-- サイドバー：メールリスト -->
    <aside class="mail-sidebar">
      <div class="sidebar-header">受信トレイ</div>
      <div id="mail-list" class="mail-list"></div>
    </aside>

    <!-- メイン：本文表示 -->
    <main class="mail-main">
      <div id="detail-placeholder" class="placeholder">
        メールを選択してください
      </div>

      <div id="detail-content" class="mail-detail hidden">
        <div class="mail-header">
          <h2 id="detail-subject" class="mail-subject"></h2>
          <div class="mail-meta">
            <span id="detail-sender" class="mail-sender"></span>
            <span id="detail-date" class="mail-date"></span>
          </div>
        </div>
        <div id="detail-body" class="mail-body"></div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="entension.js"></script>
</body>
</html>
