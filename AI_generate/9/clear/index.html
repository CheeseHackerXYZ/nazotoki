<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME CLEAR!</title>
  <link rel="stylesheet" href="clear.css">
</head>
<body>
  <main class="clear-container">
    <header class="clear-header">
      <h1 class="clear-title">GAME CLEAR!</h1>
      <p class="clear-subtitle">おめでとうございます！見事にクリアしました！</p>
    </header>

    <section class="score-card">
      <div class="score-item">
        <span class="score-label">CLEAR TIME</span>
        <span id="clear-time" class="score-value">--:--</span>
      </div>
      <div class="score-item">
        <span class="score-label">SCORE</span>
        <span id="clear-score" class="score-value">0</span>
      </div>
    </section>

    <footer class="action-buttons">
      <button id="btn-share-x" class="btn btn-x">
        <svg class="x-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        Xにポストする
      </button>

      <a href="../index.html" class="btn btn-retry">タイトルへ戻る</a>
    </footer>
  </main>

  <script src="clear.js"></script>
</body>
</html>
