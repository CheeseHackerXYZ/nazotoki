<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲームクリア</title>
  <link rel="stylesheet" href="clear.css">
</head>
<body>
  <div class="clear-container">
    <div class="clear-card">
      <h1 class="clear-title">GAME CLEAR</h1>
      <p class="clear-message">おめでとうございます！<br>あなたはこのゲームをすべての謎を解き明かし、クリアしました。</p>
      
      <div class="result-box">
        <div class="result-label">クリアタイム</div>
        <div id="clear-time" class="result-value">計算中...</div>
      </div>

      <div class="action-buttons">
        <button id="share-x-btn" class="btn btn-x">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          結果をXにポスト
        </button>
      </div>
    </div>
  </div>

  <script src="clear.js"></script>
</body>
</html>
