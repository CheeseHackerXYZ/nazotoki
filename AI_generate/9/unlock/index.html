<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解除</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>順番通りに押してから箱を開ける</h1>
    <p id="message" class="message">ボタンを押してください</p>
    
    <div class="grid">
      <!-- 0~8のインデックスを指定 -->
      <button class="btn" data-index="0">0</button>
      <button class="btn" data-index="1">1</button>
      <button class="btn" data-index="2">2</button>
      <button class="btn" data-index="3">3</button>
      <button class="btn center-btn" data-index="4">箱を開ける</button>
      <button class="btn" data-index="5">5</button>
      <button class="btn" data-index="6">6</button>
      <button class="btn" data-index="7">7</button>
      <button class="btn" data-index="8">8</button>
    </div>

    <button id="reset-btn" class="reset-btn">リセット</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
