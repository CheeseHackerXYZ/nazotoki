<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解除</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>解除する順番にボタンを押せ</h1>
    <p id="message" class="message">ボタンを押してください</p>
    
    <div class="grid">
      <button class="btn" data-key="A">A</button>
      <button class="btn" data-key="B">B</button>
      <button class="btn" data-key="C">C</button>
      <button class="btn" data-key="D">D</button>
      <button class="btn center-btn" data-key="E">E (真ん中)</button>
      <button class="btn" data-key="F">F</button>
      <button class="btn" data-key="G">G</button>
      <button class="btn" data-key="H">H</button>
      <button class="btn" data-key="I">I</button>
    </div>

    <button id="reset-btn" class="reset-btn">リセット</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
