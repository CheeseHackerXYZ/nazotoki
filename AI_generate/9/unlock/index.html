<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解除</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>順番通りに押してから箱を開ける</h1>
    <p id="message" class="message">ボタンを押してください</p>
    
    <div class="grid">
      <!-- 0~8のインデックスを指定 -->
      <button class="btn" data-index="0">4つの星を順番に濡らす</button>
      <button class="btn" data-index="1">四角を水で濡らす</button>
      <button class="btn" data-index="2">箱をひっくり返す</button>
      <button class="btn" data-index="3">箱を振る</button>
      <button class="btn center-btn" data-index="4">箱を開ける</button>
      <button class="btn" data-index="5">5</button>
      <button class="btn" data-index="6">日に当てる</button>
      <button class="btn" data-index="7">7</button>
      <button class="btn" data-index="8">ドクロを押し込む</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
