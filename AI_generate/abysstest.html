<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABYSS DIGGER — プロトタイプ</title>
  <style>
    :root {
      --bg: #090c14;
      --panel: #111726;
      --panel-2: #172033;
      --border: #26334d;
      --text: #eef4ff;
      --muted: #8fa2c7;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --gold: #facc15;
      --danger: #f43f5e;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #131d33 0%, var(--bg) 65%);
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 16, 28, 0.85);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .brand span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .top-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
    }
    .pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pill strong { color: var(--gold); }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) { background: #22304d; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #070b12;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }

    button.warn {
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fda4af;
    }

    button.ghost-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
    }

    .container {
      max-width: 1220px;
      margin: 20px auto;
      padding: 0 18px 36px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .course-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.88rem;
    }

    .time-display {
      font-size: 3.1rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }
    .sub-status {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .sub-status span { color: var(--accent); font-weight: 700; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
    }

    /* 掘削ステージ */
    .dig-stage {
      position: relative;
      height: 310px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #1b2838 0%, #2b1d14 42%, #181326 78%, #090612 100%);
    }

    .layer-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 3;
      background: rgba(9, 12, 20, 0.78);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .toast-banner {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 4;
      background: rgba(250, 204, 21, 0.16);
      border: 1px solid var(--gold);
      color: #fef08a;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .toast-banner.show {
      opacity: 1;
      transform: translateY(0);
    }

    .ground-wall {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 125px;
      background:
        radial-gradient(circle at 18% 35%, rgba(255,255,255,0.08) 0 4px, transparent 5px),
        radial-gradient(circle at 65% 55%, rgba(255,255,255,0.06) 0 6px, transparent 7px),
        linear-gradient(180deg, #3b281c 0%, #1d1526 100%);
      border-top: 2px solid rgba(255,255,255,0.12);
    }

    .miner-wrap {
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-55%);
      z-index: 2;
      width: 170px;
      height: 150px;
    }

    .pickaxe-pivot {
      transform-origin: 98px 66px;
      transform: rotate(0deg);
    }
    .dig-stage.running .pickaxe-pivot {
      animation: swingPickaxe var(--swing-speed, 0.75s) ease-in-out infinite;
    }
    @keyframes swingPickaxe {
      0%, 100% { transform: rotate(-18deg); }
      55% { transform: rotate(42deg); }
    }

    .miner-body {
      transform-origin: 85px 95px;
    }
    .dig-stage.running .miner-body {
      animation: bobBody var(--swing-speed, 0.75s) ease-in-out infinite;
    }
    @keyframes bobBody {
      0%, 100% { transform: translateY(0px); }
      55% { transform: translateY(5px); }
    }

    .spark {
      position: absolute;
      bottom: 96px;
      left: 56%;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--gold);
      opacity: 0;
      pointer-events: none;
    }
    .dig-stage.running .spark {
      animation: sparkPop var(--swing-speed, 0.75s) ease-out infinite;
    }
    @keyframes sparkPop {
      0%, 50% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      65% { opacity: 1; transform: translate(24px, -22px) scale(1.1); }
      100% { opacity: 0; transform: translate(42px, 12px) scale(0.3); }
    }

    /* 右カラム */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-bar {
      height: 10px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transition: width 0.25s linear;
    }

    .bag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 64px;
      padding: 10px;
      background: var(--panel-2);
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .loot-chip {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid transparent;
      background: #0d1320;
    }
    .rar-N { border-color: #64748b; color: #cbd5e1; }
    .rar-R { border-color: #38bdf8; color: #7dd3fc; }
    .rar-SR { border-color: #facc15; color: #fde047; }
    .rar-UR { border-color: #e879f9; color: #f5d0fe; box-shadow: 0 0 12px rgba(232,121,249,0.28); }

    .pickaxe-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .pickaxe-info strong { display: block; font-size: 0.98rem; }
    .pickaxe-info small { color: var(--muted); font-size: 0.8rem; }

    .achieve-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 520px) {
      .achieve-grid { grid-template-columns: 1fr; }
    }
    .ach-item {
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      opacity: 0.58;
    }
    .ach-item.unlocked {
      opacity: 1;
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.08);
    }
    .ach-item strong { display: block; margin-bottom: 2px; font-size: 0.83rem; }
    .ach-item span { color: var(--muted); }

    /* 開封モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.84);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 660px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }
    .modal h2 { margin: 0 0 6px; font-size: 1.3rem; }
    .modal p { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }

    .unbox-stage {
      min-height: 150px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .revealed-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .rev-card {
      padding: 10px;
      border-radius: 10px;
      background: #0c121f;
      border: 1px solid var(--border);
    }
    .rev-card .tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .rev-card .name { font-weight: 700; font-size: 0.9rem; display: block; }
    .rev-card .desc { color: var(--muted); font-size: 0.76rem; margin-top: 3px; display: block; }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>ABYSS DIGGER</h1>
      <span>5分ごとに発掘・途中帰還でも戦利品保証</span>
    </div>
    <div class="top-stats">
      <div class="pill">掘削欠片: <strong id="shardCount">0</strong></div>
      <div class="pill">図鑑: <strong id="dexCount">0 / 8</strong></div>
      <div class="pill">累計時間: <strong id="totalMin">0</strong>分</div>
      <button class="ghost-sm" id="openDexBtn">図鑑を見る</button>
    </div>
  </header>

  <main class="container">
    <!-- 左：タイマー＆掘削ステージ -->
    <section class="card">
      <div class="timer-header">
        <div>
          <label for="courseSelect" style="font-size:0.82rem;color:var(--muted);">セッション時間：</label>
          <select id="courseSelect" class="course-select">
            <option value="25">25分（集中スプリント）</option>
            <option value="45">45分（ミドル深度）</option>
            <option value="60" selected>60分（1時間アビス）</option>
            <option value="90">90分（深淵耐久）</option>
            <option value="120">120分（限界突破）</option>
          </select>
        </div>
        <button class="ghost-sm" id="skip5MinBtn" title="試作確認用：5分（300秒）進める">+5分テスト進行</button>
      </div>

      <div class="time-display" id="timerText">60:00</div>
      <div class="sub-status">
        現在深度：<span id="depthText">0m</span>（経過 <span id="elapsedText">00:00</span>）
      </div>

      <div class="controls">
        <button class="primary" id="startPauseBtn">掘り始める</button>
        <button class="warn" id="returnBtn" disabled>帰還して開封（セーブ）</button>
        <button id="resetBtn">リセット</button>
      </div>

      <div class="dig-stage" id="digStage">
        <div class="layer-badge" id="layerBadge">第1層：表層（0m〜）</div>
        <div class="toast-banner" id="toastBanner">発掘成功！</div>

        <div class="miner-wrap">
          <svg viewBox="0 0 170 150" width="170" height="150" aria-label="ツルハシで掘る人間">
            <!-- 体のグループ -->
            <g class="miner-body">
              <!-- 足 -->
              <rect x="74" y="102" width="10" height="24" rx="4" fill="#334155" />
              <rect x="88" y="102" width="10" height="24" rx="4" fill="#1e293b" />
              <!-- 胴体 -->
              <rect x="70" y="64" width="32" height="42" rx="8" fill="#38bdf8" />
              <!-- 頭 -->
              <circle cx="86" cy="46" r="15" fill="#fed7aa" />
              <!-- ヘルメット -->
              <path d="M70 43 C70 28, 102 28, 102 43 Z" fill="#facc15" />
              <!-- 目 -->
              <circle cx="93" cy="47" r="2.2" fill="#0f172a" />
            </g>

            <!-- ツルハシ（柄＋先端） -->
            <g class="pickaxe-pivot" id="pickaxeGroup">
              <!-- 腕 -->
              <line x1="94" y1="74" x2="112" y2="66" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" />
              <!-- 柄 -->
              <line x1="78" y1="92" x2="136" y2="40" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
              <!-- ツルハシの刃 -->
              <path id="pickaxeHead" d="M116 26 Q142 36 150 62 Q134 48 116 26 Z" fill="#a16207" stroke="#fef08a" stroke-width="1.2" />
            </g>
          </svg>
        </div>

        <div class="spark" id="sparkEl"></div>
        <div class="ground-wall"></div>
      </div>
    </section>

    <!-- 右：戦利品バッグ・ツルハシ進化・実績 -->
    <aside class="right-col">
      <div class="card">
        <h2 class="section-title">
          <span>次の発掘まで</span>
          <span id="nextDropCountdown" style="color:var(--gold);font-variant-numeric:tabular-nums;">05:00</span>
        </h2>
        <div class="progress-bar">
          <div class="progress-fill" id="dropProgress"></div>
        </div>

        <h2 class="section-title" style="margin-top:16px;">
          <span>今回の戦利品バッグ（保証）</span>
          <span id="bagCount" style="color:var(--accent);font-size:0.88rem;">0個</span>
        </h2>
        <div class="bag-list" id="bagList">
          <span style="color:var(--muted);font-size:0.82rem;align-self:center;">5分ごとに戦利品がここへ溜まります。</span>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title"><span>ツルハシ進化</span></h2>
        <div class="pickaxe-box">
          <div class="pickaxe-info">
            <strong id="pickName">Lv.1 木のツルハシ</strong>
            <small id="pickDesc">頼りない木のツルハシ。ここから掘り始めよう。</small>
          </div>
          <button class="primary" id="upgradePickBtn">強化（10欠片）</button>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title"><span>実績</span></h2>
        <div class="achieve-grid" id="achieveGrid"></div>
      </div>
    </aside>
  </main>

  <!-- 開封・図鑑モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">戦利品 開封タイム</h2>
      <p id="modalDesc">獲得した戦利品を開封して図鑑と欠片を手に入れよう！</p>
      <div class="unbox-stage">
        <div class="revealed-list" id="revealedList"></div>
      </div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    const CHECKPOINT_SEC = 300; // 5分 = 300秒

    const PICKAXES = [
      { lv: 1, name: "Lv.1 木のツルハシ", desc: "頼りない木のツルハシ。ここから掘り始めよう。", cost: 10, color: "#a16207", speed: "0.85s" },
      { lv: 2, name: "Lv.2 石ころツルハシ", desc: "ゴツゴツした石製。少し重厚感が出た。", cost: 25, color: "#94a3b8", speed: "0.72s" },
      { lv: 3, name: "Lv.3 サビた鉄のツルハシ", desc: "金属の感触。硬い地層も砕きやすい。", cost: 50, color: "#cbd5e1", speed: "0.60s" },
      { lv: 4, name: "Lv.4 ネオン・ピックアクス", desc: "蛍光色に光る刃。テンポよく掘り抜く。", cost: 90, color: "#38bdf8", speed: "0.48s" },
      { lv: 5, name: "Lv.5 プラズマ・ツルハシ", desc: "高エネルギーで閃光を放つ掘削機。", cost: 150, color: "#facc15", speed: "0.38s" },
      { lv: 6, name: "Lv.6 深淵のルーン・ツルハシ", desc: "最高峰の遺物ツルハシ。深淵も怖くない。", cost: null, color: "#e879f9", speed: "0.28s" }
    ];

    const ARTIFACTS = [
      { id: "eraser", rar: "N", name: "カピカピの消しゴムのカス", desc: "集めると丸い玉になるやつ。なぜか捨てられない。", shards: 2 },
      { id: "usb", rar: "N", name: "空っぽの謎USB", desc: "かつて何かを保存しようとした痕跡がある。", shards: 3 },
      { id: "cola", rar: "R", name: "冷めないコーラの缶", desc: "ずっとヒンヤリしている不思議な缶。", shards: 6 },
      { id: "lead", rar: "R", name: "折れないシャー芯", desc: "筆圧強めでも折れにくい伝説の0.5mm。", shards: 7 },
      { id: "lens", rar: "SR", name: "徹夜明けの眼光レンズ", desc: "かけると目の下のクマが光の輪に見える。", shards: 14 },
      { id: "bubble", rar: "SR", name: "無限プチプチシート", desc: "指先が寂しいときに脳へ刺激を送る。", shards: 15 },
      { id: "core", rar: "UR", name: "ドーパミン・コア", desc: "深淵の最奥で脈打つ虹色の結晶。", shards: 30 },
      { id: "hourglass", rar: "UR", name: "『あと5分だけ』の砂時計", desc: "あと少しだけ粘りたくなる魔性の砂時計。", shards: 35 }
    ];

    const ACHIEVEMENTS = [
      { id: "first_dig", title: "最初の一振り", desc: "最初の5分チェックポイントを突破する" },
      { id: "stone_age", title: "木こり卒業", desc: "ツルハシをLv.2以上に進化させる" },
      { id: "deep_60", title: "深淵の住人", desc: "1回のセッションで60分以上掘る" },
      { id: "max_pick", title: "究極の掘り師", desc: "ツルハシを最大Lv.6まで進化させる" }
    ];

    const STORAGE_KEY = "abyss_digger_proto_v1";

    function loadSave() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        shards: 0,
        pickLv: 1,
        totalSec: 0,
        dex: [],
        achievements: []
      };
    }

    let save = loadSave();

    // セッション状態
    let courseMin = 60;
    let remainingSec = 60 * 60;
    let elapsedSec = 0;
    let checkpointProgressSec = 0;
    let running = false;
    let bag = []; // 未開封の戦利品オブジェクト配列
    let unboxQueue = [];
    let revealedItems = [];
    let modalMode = "unbox"; // "unbox" | "dex"
    let tickTimer = null;
    let toastTimeout = null;

    const $ = (id) => document.getElementById(id);

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    }

    function showToast(msg) {
      const el = $("toastBanner");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function unlockAchievement(id) {
      if (!save.achievements.includes(id)) {
        save.achievements.push(id);
        const ach = ACHIEVEMENTS.find((a) => a.id === id);
        if (ach) showToast(`実績解除：${ach.title}`);
        persist();
      }
    }

    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    function rollArtifact(elapsedMinutes) {
      // 経過時間が長いほどSR/URが出やすくなる緩やかな重み付け
      const srWeight = elapsedMinutes >= 30 ? 28 : elapsedMinutes >= 15 ? 18 : 10;
      const urWeight = elapsedMinutes >= 45 ? 14 : elapsedMinutes >= 20 ? 6 : 2;
      const rWeight = 36;
      const nWeight = Math.max(10, 100 - (srWeight + urWeight + rWeight));

      const roll = Math.random() * (nWeight + rWeight + srWeight + urWeight);
      let targetRar = "N";
      if (roll < nWeight) targetRar = "N";
      else if (roll < nWeight + rWeight) targetRar = "R";
      else if (roll < nWeight + rWeight + srWeight) targetRar = "SR";
      else targetRar = "UR";

      const pool = ARTIFACTS.filter((a) => a.rar === targetRar);
      const picked = pool[Math.floor(Math.random() * pool.length)];
      return { ...picked, uid: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}` };
    }

    function onCheckpointReached() {
      const elapsedMin = Math.floor(elapsedSec / 60);
      const item = rollArtifact(elapsedMin);
      bag.push(item);
      unlockAchievement("first_dig");
      if (elapsedMin >= 60) unlockAchievement("deep_60");
      showToast(`発掘！${item.name}（${item.rar}）をバッグに確保`);
      render();
    }

    function advanceSeconds(deltaSec) {
      for (let i = 0; i < deltaSec; i++) {
        if (remainingSec <= 0) break;
        remainingSec -= 1;
        elapsedSec += 1;
        save.totalSec += 1;
        checkpointProgressSec += 1;

        if (checkpointProgressSec >= CHECKPOINT_SEC) {
          checkpointProgressSec -= CHECKPOINT_SEC;
          onCheckpointReached();
        }
      }
      persist();
      if (remainingSec <= 0) {
        stopTimer();
        openUnboxModal("セッション完了！戦利品を開封しよう");
      }
      render();
    }

    function startTimer() {
      if (running || remainingSec <= 0) return;
      running = true;
      $("digStage").classList.add("running");
      $("startPauseBtn").textContent = "一時停止";
      tickTimer = setInterval(() => advanceSeconds(1), 1000);
      render();
    }

    function stopTimer() {
      running = false;
      $("digStage").classList.remove("running");
      $("startPauseBtn").textContent = "掘り始める";
      clearInterval(tickTimer);
      tickTimer = null;
      render();
    }

    function resetSession() {
      stopTimer();
      courseMin = Number($("courseSelect").value);
      remainingSec = courseMin * 60;
      elapsedSec = 0;
      checkpointProgressSec = 0;
      bag = [];
      render();
    }

    function openUnboxModal(titleText) {
      stopTimer();
      modalMode = "unbox";
      unboxQueue = [...bag];
      revealedItems = [];
      bag = [];
      $("modalTitle").textContent = titleText || "戦利品 開封タイム";
      $("modalDesc").textContent = unboxQueue.length > 0
        ? `バッグから ${unboxQueue.length} 個の戦利品を持ち帰りました。開封しましょう！`
        : "今回のバッグは空でした。次は5分以上掘ってみよう！";
      renderModal();
      $("modalBackdrop").classList.add("open");
      render();
    }

    function openDexModal() {
      stopTimer();
      modalMode = "dex";
      $("modalTitle").textContent = "アーティファクト図鑑";
      $("modalDesc").textContent = `発見済み：${save.dex.length} / ${ARTIFACTS.length} 種`;
      renderModal();
      $("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      render();
    }

    function revealOne() {
      if (unboxQueue.length === 0) return;
      const item = unboxQueue.shift();
      revealedItems.push(item);
      save.shards += item.shards;
      if (!save.dex.includes(item.id)) {
        save.dex.push(item.id);
      }
      persist();
      renderModal();
    }

    function revealAll() {
      while (unboxQueue.length > 0) {
        revealOne();
      }
    }

    function renderModal() {
      const listEl = $("revealedList");
      const actionsEl = $("modalActions");
      listEl.innerHTML = "";
      actionsEl.innerHTML = "";

      if (modalMode === "dex") {
        ARTIFACTS.forEach((art) => {
          const found = save.dex.includes(art.id);
          const div = document.createElement("div");
          div.className = "rev-card";
          div.style.opacity = found ? "1" : "0.45";
          div.innerHTML = `
            <span class="tag rar-${art.rar}">${art.rar}</span>
            <span class="name">${found ? art.name : "？？？"}</span>
            <span class="desc">${found ? art.desc : "まだ発掘していない遺物"}</span>
          `;
          listEl.appendChild(div);
        });
        const closeBtn = document.createElement("button");
        closeBtn.className = "primary";
        closeBtn.textContent = "閉じる";
        closeBtn.onclick = closeModal;
        actionsEl.appendChild(closeBtn);
        return;
      }

      if (revealedItems.length === 0 && unboxQueue.length === 0) {
        listEl.innerHTML = `<span style="color:var(--muted);font-size:0.88rem;">開封する戦利品はありません。</span>`;
      } else {
        revealedItems.forEach((it) => {
          const div = document.createElement("div");
          div.className = "rev-card";
          div.innerHTML = `
            <span class="tag rar-${it.rar}">${it.rar} / +${it.shards}欠片</span>
            <span class="name">${it.name}</span>
            <span class="desc">${it.desc}</span>
          `;
          listEl.appendChild(div);
        });
      }

      if (unboxQueue.length > 0) {
        const nextBtn = document.createElement("button");
        nextBtn.className = "primary";
        nextBtn.textContent = `1つ開ける（残り${unboxQueue.length}）`;
        nextBtn.onclick = revealOne;

        const allBtn = document.createElement("button");
        allBtn.textContent = "まとめて全部開ける";
        allBtn.onclick = revealAll;

        actionsEl.appendChild(allBtn);
        actionsEl.appendChild(nextBtn);
      } else {
        const doneBtn = document.createElement("button");
        doneBtn.className = "primary";
        doneBtn.textContent = "完了して戻る";
        doneBtn.onclick = closeModal;
        actionsEl.appendChild(doneBtn);
      }
    }

    function upgradePickaxe() {
      const current = PICKAXES.find((p) => p.lv === save.pickLv);
      if (!current || current.cost === null) return;
      if (save.shards < current.cost) return;

      save.shards -= current.cost;
      save.pickLv += 1;
      if (save.pickLv >= 2) unlockAchievement("stone_age");
      if (save.pickLv >= 6) unlockAchievement("max_pick");
      persist();
      showToast(`進化！${PICKAXES[save.pickLv - 1].name}`);
      render();
    }

    function render() {
      const pick = PICKAXES.find((p) => p.lv === save.pickLv) || PICKAXES[0];
      const depthMeters = Math.floor((elapsedSec / 60) * 15);
      const layerLabel =
        depthMeters >= 600 ? "第4層：アビス深淵（600m〜）" :
        depthMeters >= 300 ? "第3層：水晶・蛍光層（300m〜）" :
        depthMeters >= 150 ? "第2層：岩盤・鍾乳洞（150m〜）" :
        "第1層：表層（0m〜）";

      $("shardCount").textContent = save.shards;
      $("dexCount").textContent = `${save.dex.length} / ${ARTIFACTS.length}`;
      $("totalMin").textContent = Math.floor(save.totalSec / 60);

      $("timerText").textContent = formatMMSS(remainingSec);
      $("elapsedText").textContent = formatMMSS(elapsedSec);
      $("depthText").textContent = `${depthMeters}m`;
      $("layerBadge").textContent = layerLabel;

      const remCheck = CHECKPOINT_SEC - checkpointProgressSec;
      $("nextDropCountdown").textContent = formatMMSS(remCheck);
      $("dropProgress").style.width = `${(checkpointProgressSec / CHECKPOINT_SEC) * 100}%`;

      $("returnBtn").disabled = bag.length === 0 && elapsedSec === 0;

      // ツルハシ反映
      $("digStage").style.setProperty("--swing-speed", pick.speed);
      $("pickaxeHead").setAttribute("fill", pick.color);
      $("pickName").textContent = pick.name;
      $("pickDesc").textContent = pick.desc;

      const upBtn = $("upgradePickBtn");
      if (pick.cost === null) {
        upBtn.textContent = "最大Lv";
        upBtn.disabled = true;
      } else {
        upBtn.textContent = `強化（${pick.cost}欠片）`;
        upBtn.disabled = save.shards < pick.cost;
      }

      // 戦利品バッグ
      $("bagCount").textContent = `${bag.length}個`;
      const bagEl = $("bagList");
      bagEl.innerHTML = "";
      if (bag.length === 0) {
        bagEl.innerHTML = `<span style="color:var(--muted);font-size:0.82rem;align-self:center;">5分ごとに戦利品がここへ溜まります。</span>`;
      } else {
        bag.forEach((it) => {
          const span = document.createElement("span");
          span.className = `loot-chip rar-${it.rar}`;
          span.textContent = `[${it.rar}] ${it.name}`;
          bagEl.appendChild(span);
        });
      }

      // 実績
      const achGrid = $("achieveGrid");
      achGrid.innerHTML = "";
      ACHIEVEMENTS.forEach((a) => {
        const unlocked = save.achievements.includes(a.id);
        const div = document.createElement("div");
        div.className = `ach-item ${unlocked ? "unlocked" : ""}`;
        div.innerHTML = `<strong>${unlocked ? "★ " : ""}${a.title}</strong><span>${a.desc}</span>`;
        achGrid.appendChild(div);
      });
    }

    $("startPauseBtn").addEventListener("click", () => (running ? stopTimer() : startTimer()));
    $("resetBtn").addEventListener("click", resetSession);
    $("courseSelect").addEventListener("change", resetSession);
    $("returnBtn").addEventListener("click", () => openUnboxModal("途中帰還！確保した戦利品を開封"));
    $("upgradePickBtn").addEventListener("click", upgradePickaxe);
    $("openDexBtn").addEventListener("click", openDexModal);
    $("skip5MinBtn").addEventListener("click", () => advanceSeconds(CHECKPOINT_SEC));

    render();
  </script>
</body>
</html>
