<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Index</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    li a:hover {
      background-color: #334155;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    li a::after {
      content: "→";
      color: #64748b;
    }
    li a:hover::after {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h1>Index</h1>

  <ul>
    <li><a href="1.html">Page 1 (1.html)</a></li>
    <li><a href="2.html">Page 2 (2.html)</a></li>
    <li><a href="3.html">Page 3 (3.html)</a></li>
    <li><a href="4.html">Page 4 (4.html)</a></li>
    <li><a href="5/index.html">Page 5 (5/index.html)</a></li>
    <li><a href="6/index.html">Page 6 (6/index.html)</a></li>
  </ul>

</body>
</html>
