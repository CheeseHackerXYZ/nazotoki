<style>

*{box-sizing:border-box}

.fb h3{font:700 17px "Shippori Mincho",serif;margin:16px 0 4px}

</style>
</head>

</main>

{theme:"テーマ：孤立牌の整理（字牌の価値差）",round:"東1局",turn:5,wind:"南",dora:"8p",pts:"25000点 / 25000点",

var mode="fix",cur=null,i=0,score={best:0,ok:0,bad:0},answered=false,hist=load();

function $(id){return document.getElementById(id)}

var HN="東南西北白發中",TERM=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function ix(t){var k=HN.indexOf(t);return k>=0?27+k:"mps".indexOf(t[1])*9+(+t[0])-1}
function cd(k){return k>=27?HN[k-27]:(k%9+1)+"mps"[Math.floor(k/9)]}
function cnt(a){var c=[];for(var k=0;k<34;k++)c.push(0);a.forEach(function(t){c[ix(t)]++});return c}
function shN(c){var best=8;
 function rec(k,m,t,p){while(k<34&&c[k]==0)k++;
  if(k>=34){var s=8-2*m-Math.min(t,4-m)-p;if(s<best)best=s;return}
  if(c[k]>=3){c[k]-=3;rec(k,m+1,t,p);c[k]+=3}
  if(k<27&&k%9<=6&&c[k+1]>0&&c[k+2]>0){c[k]--;c[k+1]--;c[k+2]--;rec(k,m+1,t,p);c[k]++;c[k+1]++;c[k+2]++}

  if(k<27&&k%9<=7&&c[k+1]>0){c[k]--;c[k+1]--;rec(k,m,t+1,p);c[k]++;c[k+1]++}
  if(k<27&&k%9<=6&&c[k+2]>0){c[k]--;c[k+2]--;rec(k,m,t+1,p);c[k]++;c[k+2]++}

function shape(c){var pr=0,kd=0;c.forEach(function(v){if(v>=2)pr++;if(v>=1)kd++});return 6-pr+Math.max(0,7-kd)}

  for(var t=0;t<34;t++){var left=4-c[t]-(t==k?1:0)-(sn?sn[t]:0);if(left<=0)continue;c[t]++;if(sh(c)<s){w.push(cd(t));n+=left}c[t]--}
  c[k]++;out.push({t:cd(k),s:s,n:n,w:w})}
 out.sort(function(a,b){return a.s-b.s||b.n-a.n});return out}
function newRandom(){var all=[],r,tries=0,h,res,ms;for(var k=0;k<34;k++)for(var j=0;j<4;j++)all.push(cd(k));
 do{tries++;var a=all.slice();for(var x=a.length-1;x>0;x--){var y=Math.floor(Math.random()*(x+1)),z=a[x];a[x]=a[y];a[y]=z}

 var d=h[Math.floor(Math.random()*14)],rest=h.slice();rest.splice(rest.indexOf(d),1);rest.sort(function(a,b){return ix(a)-ix(b)});
 var cand=res.filter(function(e){return e.s==ms}),mx=cand[0].n;
 var R=["東1局","東2局","東3局","南1局","南2局","南3局"];
 cur={rand:true,theme:"ランダム問題：牌効率で最も良い1枚を選ぶ",round:R[Math.floor(Math.random()*R.length)],turn:4+Math.floor(Math.random()*7),wind:HN[Math.floor(Math.random()*4)],dora:cd(Math.floor(Math.random()*34)),pts:"25000点 / 25000点",hand:rest,draw:d,res:res,
  bests:cand.filter(function(e){return e.n==mx}).map(function(e){return e.t}),oks:cand.filter(function(e){return e.n<mx&&e.n>=mx*0.8}).map(function(e){return e.t})}}
function pr(n,N,k){var q=1;for(var j=0;j<k;j++)q*=Math.max(0,N-n-j)/(N-j);return 1-q}
function pct(x){return (x*100).toFixed(1)+"%"}
function randFb(p,t,g,L){
 var seen=p.seen?p.seen.reduce(function(a,b){return a+b},0):0,N=122-seen;
 function rows(list){return list.map(function(e){return "<div class='row"+(e.t==t?" me":"")+"'><span class='c'>"+mini(e.t)+" 切り</span><span>"+(e.s==0?"テンパイ":e.s+"向聴")+"</span><span>受け入れ "+e.n+"枚</span><span>1巡 "+pct(pr(e.n,N,1))+"</span><span>3巡 "+pct(pr(e.n,N,3))+"</span><span>6巡 "+pct(pr(e.n,N,6))+"</span><span class='w'>"+e.w.map(function(x){return mini(x)}).join("")+"</span></div>"}).join("")}
 var B=p.res.filter(function(e){return p.bests.indexOf(e.t)>=0}),O=p.res.filter(function(e){return p.oks.indexOf(e.t)>=0}),R=p.res.filter(function(e){return p.bests.indexOf(e.t)<0&&p.oks.indexOf(e.t)<0});
 function sec(h,l){return l.length?"<h3>"+h+"</h3><div class='tb'>"+rows(l)+"</div>":""}
 $("fb").innerHTML="<span class='verdict "+g+"'>"+L[g]+"</span>\u3000"+mini(t)+" を切る"
  +"<p class='stat'>確率は、その打牌の後に「向聴数が1つ進む牌（テンパイ形なら和了牌）」を1枚以上引く確率です。1巡・3巡・6巡以内を、山の推定残り"+N+"枚から超幾何分布で計算しています。次善は、最善と同じ向聴数で受け入れが8割以上の打牌です。ドラ・役・河・守備は考慮していません。</p>"
  +sec("最善",B)+sec("次善",O)+sec("その他",R)
  +"<button class='btn' id='next'>"+(mode=="seq"?"ツモ山から次を引く":"次のランダム問題")+"</button>";
 $("fb").hidden=false;stat();
 $("next").onclick=function(){if(mode=="seq")seqNext(t);else{newRandom();show();window.scrollTo(0,0)}};
 $("fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function srt(a){return a.sort(function(x,y){return ix(x)-ix(y)})}
function seqBuild(){var h=cur.hand.concat([cur.draw]);cur.res=evalHand(h,cur.seen);var ms=cur.res[0].s,cand=cur.res.filter(function(e){return e.s==ms}),mx=cand[0].n;
 cur.bests=cand.filter(function(e){return e.n==mx}).map(function(e){return e.t});cur.oks=cand.filter(function(e){return e.n<mx&&e.n>=mx*0.8}).map(function(e){return e.t});
 cur.turn=4+cur.n;cur.theme="連続モード："+cur.n+"手目"+(cur.disc.length?"　捨て牌 "+cur.disc.join(" "):"　配牌から開始")}
function newSeq(){var all=[],h,r,tries=0;for(var k=0;k<34;k++)for(var j=0;j<4;j++)all.push(cd(k));
 do{tries++;for(var x=all.length-1;x>0;x--){var y=Math.floor(Math.random()*(x+1)),z=all[x];all[x]=all[y];all[y]=z}
  h=all.slice(0,14);r=evalHand(h)}while((r[0].s<2||r[0].s>3)&&tries<200);
 var sn=[];for(var q=0;q<34;q++)sn.push(0);
 cur={rand:true,seq:true,round:"東1局",wind:"南",dora:cd(Math.floor(Math.random()*34)),pts:"25000点 / 25000点",n:1,max:12,done:0,good:0,disc:[],seen:sn,wall:all.slice(14),hand:srt(h.slice(0,13)),draw:h[13]};
 seqBuild()}
function seqNext(t){var hh=cur.hand.concat([cur.draw]);hh.splice(hh.indexOf(t),1);cur.disc.push(t);cur.seen[ix(t)]++;cur.hand=srt(hh);
 var s=sh(cnt(cur.hand));if(cur.n>=cur.max||!cur.wall.length)return seqEnd(s,false);
 var d=cur.wall.pop();if(sh(cnt(cur.hand.concat([d])))==-1){cur.draw=d;return seqEnd(-1,true)}
 cur.n++;cur.draw=d;seqBuild();show();window.scrollTo(0,0)}
function seqEnd(s,win){$("quiz").hidden=true;var m=win?"ツモ和了！":s==0?"テンパイで終了":s+"向聴で終了";
 $("result").innerHTML="<div class='big'>"+m+"</div><p>最善手 "+cur.good+" / "+cur.done+" 手</p><p class='stat'>捨て牌："+cur.disc.join(" ")+"</p><button class='btn' id='again'>新しい配牌で再開</button>";
 $("result").hidden=false;$("again").onclick=function(){newSeq();show()}}
function setMode(m){mode=m;$("m-fix").setAttribute("aria-pressed",m=="fix");$("m-rand").setAttribute("aria-pressed",m=="rand");$("m-seq").setAttribute("aria-pressed",m=="seq");
 if(m=="rand")newRandom();else if(m=="seq")newSeq();else{i=0;score={best:0,ok:0,bad:0}}show()}
$("m-fix").onclick=function(){setMode("fix")};$("m-rand").onclick=function(){setMode("rand")};$("m-seq").onclick=function(){setMode("seq")};
show();
</script>
