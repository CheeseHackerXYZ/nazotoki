    5:{copper:20,iron:10}, 6:{iron:25}, 7:{iron:30,silver:10},
    8:{silver:25}, 9:{silver:30,gold:10}, 10:{gold:25},
    11:{gold:30,mithril:10}, 12:{mithril:25}, 13:{mithril:30,dragon:8}, 14:{dragon:25,abyss:8}
  };
  const ACHIEVEMENTS = [
    {id:'first5',name:'地底への第一歩',desc:'採掘時間が合計5分に到達',reward:1,test:s=>totalWithCurrent()>=5*60*1000},
    {id:'first30',name:'新米ディガー',desc:'採掘時間が合計30分に到達',reward:2,test:s=>totalWithCurrent()>=30*60*1000},
    {id:'hour1',name:'一時間の探検',desc:'採掘時間が合計1時間に到達',reward:3,test:s=>totalWithCurrent()>=60*60*1000},
    {id:'hour3',name:'深層への挑戦者',desc:'採掘時間が合計3時間に到達',reward:5,test:s=>totalWithCurrent()>=180*60*1000},
    {id:'pick3',name:'道具を育てる',desc:'ツルハシを3段階目に強化',reward:1,test:s=>s.pickaxeLevel>=3},
    {id:'base2',name:'自分だけの拠点',desc:'拠点をレベル2にする',reward:2,test:s=>s.baseLevel>=2},
    {id:'collect10',name:'小さなコレクター',desc:'10種類のアイテムを発見',reward:2,test:s=>Object.values(s.collection).filter(v=>v>0).length>=10}
  ];
  const LAYERS = ['忘れられた廃坑','蒼光晶洞','ネオン廃棄区画','灼熱マグマ地帯','深淵海溝','星屑の地殻','時空断層','創世の最深部'];

  function defaultState(){
    return {
      version:1,
      materials:{stone:35,copper:12,iron:0,silver:0,gold:0,mithril:0,dragon:0,abyss:0},
      tickets:3, shards:0, abyssCrystals:0,
      collection:{}, pickaxeLevel:1, baseLevel:1,
      totalMiningMs:0, sessionsCompleted:0,
      session:{active:false,running:false,elapsedMs:0,runStartedAt:null,processedCheckpoints:0,finds:[],startedAt:null},
      achievements:{}, lastSession:null, createdAt:Date.now()
    };
  }
  function loadState(){
    const fallback=defaultState();
    try{
      const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return fallback;
      const saved=JSON.parse(raw);
      return {
        ...fallback,...saved,
        materials:{...fallback.materials,...(saved.materials||{})},
        collection:{...(saved.collection||{})}, achievements:{...(saved.achievements||{})},
        session:{...fallback.session,...(saved.session||{})},
      };
    }catch(e){ console.warn('セーブデータを読み込めませんでした',e); return fallback; }
  }
  let state=loadState();
  let currentTab='home';
  let toastTimer=null;
  let lastShownSessionId=null;

  const $=sel=>document.querySelector(sel);
  const app=$('#app');
  const wallet=$('#wallet');
  const nav=$('#nav');
  const fmtTime=ms=>{
    const sec=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  const number=n=>new Intl.NumberFormat('ja-JP').format(n||0);
  const escapeHtml=str=>String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function save(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch(e){ console.warn('保存できませんでした',e); toast('このブラウザでは保存できませんでした'); } }
  function toast(message){ const el=$('#toast'); el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }
  function activeElapsed(){
    const s=state.session; if(!s.active) return 0;
    return Math.max(0,s.elapsedMs+(s.running&&s.runStartedAt?Date.now()-s.runStartedAt:0));
  }
  function totalWithCurrent(){ return state.totalMiningMs+(state.session.active?activeElapsed():0); }
  function depthNow(){ return Math.floor(totalWithCurrent()/(30*60*1000)); }
  function layerNow(){ return LAYERS[Math.min(LAYERS.length-1,depthNow())]; }
  function materialName(key){ return MATERIALS.find(m=>m.key===key)?.name||key; }
  function materialEmoji(key){ return MATERIALS.find(m=>m.key===key)?.emoji||'◆'; }
  function fmtMats(costs){return Object.entries(costs||{}).map(([k,v])=>`${materialEmoji(k)} ${materialName(k)} ×${v}`).join(' / ');}
  function canAfford(costs){return Object.entries(costs||{}).every(([k,v])=>(state.materials[k]||0)>=v);}
  function spend(costs){if(!canAfford(costs))return false;Object.entries(costs||{}).forEach(([k,v])=>state.materials[k]-=v);return true;}
  function ownedCount(){return Object.values(state.collection).reduce((a,b)=>a+b,0);}
  function discoveredCount(){return Object.values(state.collection).filter(v=>v>0).length;}
  function grantItem(item,source='発掘'){
    const old=state.collection[item.id]||0;
    state.collection[item.id]=old+1;
    if(old>0){const gain=SHARD_REWARD[item.rarity];state.shards+=gain;return {item,duplicate:true,shards:gain,source};}
    return {item,duplicate:false,shards:0,source};
  }
  function chooseRarity(weights){
    let roll=Math.random()*weights.reduce((a,b)=>a+b,0);
    for(let i=0;i<weights.length;i++){roll-=weights[i];if(roll<0)return RARITIES[i];}
    return 'N';
  }
  function itemOfRarity(rarity){const list=ITEMS.filter(i=>i.rarity===rarity);return list[Math.floor(Math.random()*list.length)];}
  function mineRewardRarity(depth){
    const weights=[72,21,5.5,1.2,.23,.05,.015,.005];
    const boost=Math.min(8,depth)*.45;
    weights[0]=Math.max(48,weights[0]-boost*2);
    weights[1]+=boost;
    weights[2]+=boost*.7;
    weights[3]+=boost*.22;
    return chooseRarity(weights);
  }
  function addFind(text){state.session.finds.unshift({text,at:Date.now()});if(state.session.finds.length>24)state.session.finds.length=24;}
  function grantCheckpoint(checkpointNumber,elapsed){
    const depth=Math.floor((state.totalMiningMs+elapsed)/(30*60*1000));
    const stoneGain=3+Math.floor(Math.random()*4);
    state.materials.stone+=stoneGain;
    addFind(`🪨 石ころ ×${stoneGain}`);
    const materialTier=Math.min(MATERIALS.length-1,Math.floor((depth+state.pickaxeLevel-1)/2));
    if(materialTier>0 && Math.random()<.45){
      const mat=MATERIALS[materialTier];const gain=1+Math.floor(Math.random()*2);state.materials[mat.key]+=gain;addFind(`${mat.emoji} ${mat.name} ×${gain}`);
    } else if(materialTier===0 && Math.random()<.35){
      const gain=1+Math.floor(Math.random()*2);state.materials.copper+=gain;addFind(`🟠 銅鉱石 ×${gain}`);
    }
    if(Math.random()<Math.min(.48,.23+depth*.025)){
      const rarity=mineRewardRarity(depth);const found=grantItem(itemOfRarity(rarity));
      addFind(`${found.item.name} [${rarity}]${found.duplicate?` → 欠片 +${found.shards}`:''}`);
    }
    if(checkpointNumber%3===0){state.tickets+=1;addFind('🎟 発掘チケット ×1（15分到達）');}
    if(checkpointNumber%6===0){state.abyssCrystals+=1;addFind('🔮 深淵結晶 ×1（30分到達）');}
    save();
    toast(`${checkpointNumber*5}分チェックポイント達成！報酬を獲得しました`);
  }
  function processCheckpoints(elapsed){
    const target=Math.floor(elapsed/CHECKPOINT_MS);
    while(state.session.processedCheckpoints<target){
      state.session.processedCheckpoints++;
      grantCheckpoint(state.session.processedCheckpoints,elapsed);
    }
  }
  function checkAchievements(){
    let changed=false;
    for(const a of ACHIEVEMENTS){
      if(!state.achievements[a.id]&&a.test(state)){
        state.achievements[a.id]=Date.now();
        state.tickets+=a.reward;
        toast(`実績解除「${a.name}」：発掘チケット +${a.reward}`);
        changed=true;
      }
    }
    if(changed)save();
  }
  function updateSessionProgress(){
    if(state.session.active){const elapsed=activeElapsed();processCheckpoints(elapsed);checkAchievements();}
  }
  function startSession(){
    if(state.session.active){toast('すでに採掘セッション中です');return;}
    state.session={active:true,running:true,elapsedMs:0,runStartedAt:Date.now(),processedCheckpoints:0,finds:[],startedAt:Date.now()};
    save();currentTab='mine';render();toast('採掘を開始しました。自分のペースで進めましょう！');
  }
  function pauseSession(){
    if(!state.session.active||!state.session.running)return;
    const elapsed=activeElapsed();state.session.elapsedMs=elapsed;state.session.running=false;state.session.runStartedAt=null;
    processCheckpoints(elapsed);checkAchievements();save();render();toast('一時停止しました。獲得済み報酬はそのままです');
  }
  function resumeSession(){
    if(!state.session.active||state.session.running)return;
    state.session.running=true;state.session.runStartedAt=Date.now();save();render();toast('採掘を再開しました');
  }
  function finishSession(){
    if(!state.session.active)return;
    const elapsed=activeElapsed();processCheckpoints(elapsed);
    state.session.elapsedMs=elapsed;state.totalMiningMs+=elapsed;state.sessionsCompleted++;
    state.lastSession={elapsedMs:elapsed,finds:[...state.session.finds],finishedAt:Date.now()};
    state.session={active:false,running:false,elapsedMs:0,runStartedAt:null,processedCheckpoints:0,finds:[],startedAt:null};
    checkAchievements();save();render();showSessionModal(state.lastSession);
  }
  function showSessionModal(session){
    const finds=(session.finds||[]).slice(0,10);
    $('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="採掘結果" onclick="event.stopPropagation()"><div class="chest">📦</div><div class="eyebrow">SESSION COMPLETE</div><h3>採掘結果</h3><div class="timer" style="font-size:34px">${fmtTime(session.elapsedMs)}</div><p>今回の採掘で確定した報酬は、すべて所持品に保存されています。</p>${finds.length?`<div class="modal-items">${finds.map(f=>`<div class="loot-line">${escapeHtml(f.text)}</div>`).join('')}</div>`:'<div class="empty">今回はチェックポイント報酬の対象時間に届きませんでした。次回に続けられます。</div>'}<button class="btn primary" data-action="close-modal">拠点へ戻る</button></div></div>`;
  }

  function header(eyebrow,title,sub,action=''){
    return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">${sub}</p></div>${action}</div>`;
  }
  function panel(title,body,extra='') {return `<section class="panel ${extra}"><h3>${title}</h3>${body}</section>`;}
  function walletRender(){
    wallet.innerHTML=`<div class="wallet-chip">🪨 石ころ <b>${number(state.materials.stone)}</b></div><div class="wallet-chip">🎟 チケット <b>${number(state.tickets)}</b></div><div class="wallet-chip">🧩 遺物の欠片 <b>${number(state.shards)}</b></div><div class="wallet-chip">🔮 深淵結晶 <b>${number(state.abyssCrystals)}</b></div>`;
  }
  function homePage(){
    const elapsed=totalWithCurrent();
    const facilities=[
      ['⚒️','鍛冶場','鉱石を使ってツルハシを強化する','forge'],

      ['🗃️','遺物展示室','集めたアイテムを図鑑で確認する','codex'],
      ['🧑‍🚀','採掘準備室','ツルハシと採掘状況を確認する','mine'],
      ['🖥️','管理室','活動時間・実績・冒険の記録を見る','records']

    return `${header('PERSONAL BASE','拠点','ここは採掘の成果が集まる、あなたの地下基地です。')}
      <section class="hero"><div class="hero-inner"><div><div class="eyebrow">WELCOME BACK, DIGGER</div><h2>深淵の拠点へようこそ。</h2><p class="sub">勉強や作業の時間が、地下世界を広げる力になります。今日はどこを探索しますか？</p><div class="hero-stats"><div class="stat"><small>BASE LEVEL</small><b>Lv.${state.baseLevel}</b></div><div class="stat"><small>PICKAXE</small><b>Lv.${state.pickaxeLevel}/14</b></div><div class="stat"><small>TOTAL TIME</small><b>${fmtTime(elapsed)}</b></div><div class="stat"><small>DISCOVERED</small><b>${discoveredCount()}/${ITEMS.length}</b></div></div></div><div class="hero-visual">🏕️</div></div></section>

      <div style="height:14px"></div><div class="grid two">${panel('拠点の拡張',`<div class="spread"><div><div style="font-size:25px;font-weight:850">BASE Lv.${state.baseLevel}</div><p style="margin:4px 0">施設を増やして、自分だけの基地に育てよう。</p></div><div style="font-size:36px">🏗️</div></div>${baseUpgradeSection()}`)}${panel('現在の探索エリア',`<div style="font-size:22px;font-weight:850">${layerNow()}</div><p>累計採掘時間を重ねると、より深い地層が記録されます。深度は30分ごとに進みます。</p><div class="progress"><span style="width:${Math.min(100,(totalWithCurrent()%(30*60*1000))/(30*60*1000)*100)}%"></span></div><p class="tiny">次の地層まで ${fmtTime(30*60*1000-(totalWithCurrent()%(30*60*1000)))}</p>` )}</div>`;

      <div class="grid" style="align-content:start">${panel('次のチェックポイント',`<div class="spread"><div><div style="font-size:27px;font-weight:850" class="mono">${s.active?fmtTime(toNext):'05:00'}</div><p style="margin:4px 0">次の報酬まで</p></div><div style="font-size:32px">⏳</div></div><div class="progress"><span id="checkpoint-progress" style="width:${s.active?progress:0}%"></span></div><p class="tiny">5分ごと：鉱石など ／ 15分ごと：発掘チケット ／ 30分ごと：深淵結晶</p>`)}${panel('現在の探索エリア',`<div style="font-size:20px;font-weight:850">${layerNow()}</div><p>深度レベル：${depth}　/　装備：${PICKAXES[state.pickaxeLevel-1]}</p><div class="tier-list">${LAYERS.map((l,i)=>`<span class="tier-dot ${i<=depth?'unlocked':''}" title="${l}">${i+1}</span>`).join('')}</div>`)}</div></div>

      <div class="grid two"><section class="panel"><div class="eyebrow">AVAILABLE TICKETS</div><div style="font-size:42px;font-weight:900;margin:8px 0">🎟 ${number(state.tickets)}</div><p>採掘の15分ごとの節目や実績解除で獲得できます。</p><div class="row"><button class="btn primary" data-action="pull-one" ${state.tickets<1?'disabled':''}>1回引く（1枚）</button><button class="btn gold" data-action="pull-ten" ${state.tickets<10?'disabled':''}>10回引く（10枚）</button></div></section>
      <section class="panel"><h3>通常発掘ガチャの提供割合</h3><table class="table"><thead><tr><th>レアリティ</th><th>確率</th></tr></thead><tbody>${odds}</tbody></table><p class="tiny">表示確率はこの試作版の固定値です。10回ガチャにも別の確定枠はありません。</p></section></div>
      <div style="height:14px"></div>${panel('遺物の欠片交換所',`<p>重複したアイテムは自動で欠片に変換されます。欠片を使って、欲しいレアリティのアイテムを1つ選んで交換できます。</p><div class="row"><select id="exchange-item">${ITEMS.map(i=>`<option value="${i.id}">${i.rarity} — ${i.name}</option>`).join('')}</select><button class="btn primary" data-action="exchange-item">選んだアイテムと交換</button></div><p class="tiny">現在の欠片：<b>${number(state.shards)}</b>　／　必要数はアイテムのレアリティによって異なります。</p>`)}
      <div style="height:14px"></div>${panel('ガチャについて',`<div class="notice">すべての抽選は無料のゲーム内チケットで行います。現金購入や課金ガチャはありません。確率を確認してから遊べます。</div>`)}`;
  }
  function codexPage(){
    const cards=ITEMS.map(item=>{
      const count=state.collection[item.id]||0;
      return `<div class="item-card"><div class="spread"><span class="rarity ${item.rarity}">${item.rarity}</span><span class="tiny muted">${count>0?'発見済み':'未発見'}</span></div><div class="item-name">${count>0?item.name:'？？？？？？'}</div><p>${count>0?item.desc:'まだこの遺物の記録はありません。'}</p><div class="count">所持数：${count}</div></div>`;
    }).join('');
    return `${header('COLLECTION ARCHIVE','遺物図鑑','発見した遺物がここに登録されます。重複しても図鑑の記録は残ります。')}
      <div class="grid three"><div class="panel"><div class="muted tiny">DISCOVERED TYPES</div><div style="font-size:28px;font-weight:900">${discoveredCount()} / ${ITEMS.length}</div><div class="progress" style="margin-top:10px"><span style="width:${discoveredCount()/ITEMS.length*100}%"></span></div></div><div class="panel"><div class="muted tiny">TOTAL ITEMS</div><div style="font-size:28px;font-weight:900">${number(ownedCount())}</div><p style="margin:3px 0">重複を含む所持数</p></div><div class="panel"><div class="muted tiny">COLLECTION BONUS</div><div style="font-size:28px;font-weight:900">${Math.floor(discoveredCount()/ITEMS.length*100)}%</div><p style="margin:3px 0">全${RARITIES.length}段階の遺物を収録</p></div></div>
      <div style="height:14px"></div>${panel('すべての遺物',`<div class="item-grid">${cards}</div>`)}`;
  }
  function recordsPage(){
    const total=state.totalMiningMs;
    const unlocked=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
    return `${header('CONTROL ROOM','冒険の記録','これまでの採掘時間、拠点の成長、達成した実績を確認できます。')}
      <div class="grid three"><div class="panel"><div class="muted tiny">TOTAL MINING TIME</div><div style="font-size:27px;font-weight:900" class="mono">${fmtTime(totalWithCurrent())}</div></div><div class="panel"><div class="muted tiny">COMPLETED SESSIONS</div><div style="font-size:27px;font-weight:900">${state.sessionsCompleted}</div></div><div class="panel"><div class="muted tiny">ACHIEVEMENTS</div><div style="font-size:27px;font-weight:900">${unlocked}/${ACHIEVEMENTS.length}</div></div></div>
      <div style="height:14px"></div>${panel('実績一覧',`<div class="grid two">${ACHIEVEMENTS.map(a=>`<div class="achievement ${state.achievements[a.id]?'done':''}"><div class="medal">${state.achievements[a.id]?'🏅':'🔒'}</div><div><h4>${a.name} ${state.achievements[a.id]?'✓':''}</h4><p>${a.desc} ／ 報酬：🎟 ${a.reward}</p></div></div>`).join('')}</div>`)}
      <div style="height:14px"></div><div class="grid two">${panel('セーブデータ',`<div class="notice">データはこのブラウザのローカルストレージに保存されます。同じブラウザ・同じ端末で開くと続きから遊べます。ブラウザのデータ削除や別端末への自動同期には対応していません。</div><div class="row" style="margin-top:12px"><button class="btn" data-action="export-save">セーブデータを書き出す</button><button class="btn danger" data-action="reset-save">最初からやり直す</button></div>`)}${panel('前回の採掘',state.lastSession?`<div style="font-size:25px;font-weight:850" class="mono">${fmtTime(state.lastSession.elapsedMs)}</div><p>終了：${new Date(state.lastSession.finishedAt).toLocaleString('ja-JP')}</p><div class="loot-list">${(state.lastSession.finds||[]).slice(0,8).map(f=>`<div class="loot-line">${escapeHtml(f.text)}</div>`).join('')||'<div class="empty">記録されたチェックポイント報酬はありません。</div>'}</div>`:`<div class="empty">まだ採掘セッションの記録がありません。</div>`)}</div>`;
  }
  function render(){
    walletRender();
    nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));
    const pages={home:homePage,mine:minePage,forge:forgePage,gacha:gachaPage,codex:codexPage,records:recordsPage};
    app.innerHTML=(pages[currentTab]||homePage)();
  }

  function upgradeBase(){
    if(state.baseLevel>=4)return;
    const next=state.baseLevel+1,cost=BASE_COSTS[next];if(!spend(cost)){toast('素材が足りません');return;}
    state.baseLevel=next;checkAchievements();save();render();toast(`拠点が Lv.${next} になりました！`);
  }
  function upgradePickaxe(){
    const next=state.pickaxeLevel+1;if(next>14)return;
    const cost=PICKAXE_COSTS[next];if(!spend(cost)){toast('素材が足りません');return;}
    state.pickaxeLevel=next;checkAchievements();save();render();toast(`ツルハシを「${PICKAXES[next-1]}」に強化しました！`);
  }
  function pull(count){
    if(state.tickets<count){toast('発掘チケットが足りません');return;}
    state.tickets-=count;
    const results=[];
    for(let i=0;i<count;i++){
      const rarity=chooseRarity(RARITY_WEIGHTS);const result=grantItem(itemOfRarity(rarity),'ガチャ');results.push(result);
    }
    checkAchievements();save();render();showGachaModal(results);
  }
  function showGachaModal(results){
    const best=results.reduce((a,b)=>RARITIES.indexOf(b.item.rarity)>RARITIES.indexOf(a.item.rarity)?b:a,results[0]);
    $('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="ガチャ結果" onclick="event.stopPropagation()"><div class="chest">${best.item.rarity==='EX'?'🌌':best.item.rarity==='LEGEND'?'👑':best.item.rarity==='UR'?'💎':'🎁'}</div><div class="eyebrow">RELIC DISCOVERY</div><h3>遺物を発見！</h3><div class="modal-items">${results.map(r=>`<div class="loot-line"><span><span class="rarity ${r.item.rarity}">${r.item.rarity}</span> <b>${r.item.name}</b>${r.duplicate?` <span class="muted">（重複 → 欠片 +${r.shards}）</span>`:''}</span></div>`).join('')}</div><button class="btn primary" data-action="close-modal">閉じる</button></div></div>`;
  }
  function exchangeSelected(){
    const select=$('#exchange-item');if(!select)return;
    const item=ITEMS.find(i=>i.id===select.value);if(!item)return;
    const cost=SHARD_COST[item.rarity];if(state.shards<cost){toast(`欠片が足りません（必要：${cost}）`);return;}
    state.shards-=cost;const result=grantItem(item,'交換');checkAchievements();save();render();
    toast(result.duplicate?`${item.name}を交換。重複分の欠片に変換されました`:`${item.name}を図鑑に登録しました！`);
  }
  function exportSave(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='abyss-digger-save.json';a.click();URL.revokeObjectURL(url);toast('セーブデータを書き出しました');
  }
  function resetSave(){
    const ok=confirm('セーブデータを初期化します。採掘時間・素材・アイテム・実績は元に戻せません。実行しますか？');
    if(!ok)return;state=defaultState();save();currentTab='home';$('#modal-root').innerHTML='';render();toast('新しい採掘記録を始めました');
  }

  nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;currentTab=b.dataset.tab;render();});
  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const action=b.dataset.action;
    switch(action){
      case 'go':currentTab=b.dataset.tab;render();break;
      case 'start-session':startSession();break;
      case 'pause-session':pauseSession();break;
      case 'resume-session':resumeSession();break;
      case 'finish-session':finishSession();break;
      case 'upgrade-base':upgradeBase();break;
      case 'upgrade-pickaxe':upgradePickaxe();break;
      case 'pull-one':pull(1);break;
      case 'pull-ten':pull(10);break;
      case 'exchange-item':exchangeSelected();break;
      case 'export-save':exportSave();break;
      case 'reset-save':resetSave();break;
    }
  });
  $('#modal-root').addEventListener('click',e=>{if(e.target.closest('[data-action="close-modal"]'))$('#modal-root').innerHTML='';});

  // Reloadした時点までの時間を計算し、到達済みチェックポイントを取りこぼさない。
  if(state.session.active){
    updateSessionProgress();
    if(state.session.running&&!state.session.runStartedAt){state.session.runStartedAt=Date.now();save();}
  }
  checkAchievements();
  render();
  setInterval(()=>{
    if(state.session.active){
      updateSessionProgress();
      const elapsed=activeElapsed();
      const timer=$('#timer-display');if(timer)timer.textContent=fmtTime(elapsed);
      const progress=$('#checkpoint-progress');if(progress)progress.style.width=`${(elapsed%CHECKPOINT_MS)/CHECKPOINT_MS*100}%`;
      // ナビの表示などを壊さず、タイマー画面以外も累計時間の変化を反映するための更新。
      if(currentTab==='home'){
        const heroStat=app.querySelector('.hero-stats .stat:nth-child(3) b');if(heroStat)heroStat.textContent=fmtTime(totalWithCurrent());
      }
    }
  },1000);
})();
</script>
</body>
</html>
