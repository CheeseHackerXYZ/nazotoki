<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロックダウン研究所からの脱出 - Prologue</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1a1a1a;
            border: 2px solid #ff3333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.2);
            padding: 25px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.3rem;
            color: #ff3333;
            margin-top: 0;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            text-align: center;
        }

        .story-box {
            background-color: #050505;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .alert-text {
            color: #ff6666;
            font-weight: bold;
        }

        .start-btn {
            display: block;
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 2px solid #ff3333;
            border-radius: 5px;
            padding: 12px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .start-btn:hover {
            background-color: #ff3333;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LOCKDOWN LAB : PROLOGUE</h1>
    
    <div class="story-box">
        <p>頭痛と共に目を覚ます。室内の非常灯が赤く点滅し、重厚なセキュリティドアは完全に閉じられている。</p>
        <p>周囲を見渡すと、同僚たちが倒れており全員気絶中……。</p>
        <p class="alert-text">【防犯カメラのログ】<br>リアルな侵入者が全員を襲って重要データを奪い、研究所を完全ロックダウンして逃走した。</p>
        <p>外部へ通信を試みるも、Wi-Fiはすでに乗っ取られており、犯人に盗聴＆通信ブロックされている状態だ。</p>
        <p>システムを復旧し、この閉ざされた研究所から脱出せよ！</p>
    </div>

    <a href="./game.html" class="start-btn">システム復旧を開始（ゲーム本編へ）</a>
</div>

</body>
</html>
