<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body { font-family: monospace; background: #fff; color: #333; text-align: center; padding-top: 100px; }
        h1 { font-size: 3em; }
        /* 隠しログインフォームのデザイン */
        #login-area {
            margin-top: 100px;
            padding: 20px;
        }
        input {
            border: none;
            border-bottom: 2px solid #ccc;
            background: transparent;
            font-family: monospace;
            font-size: 1.2em;
            text-align: center;
            outline: none;
            color: #333;
            width: 200px;
        }
        #error-msg { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<h1>404 Not Found</h1>
<p>The requested URL was not found on this server.</p>

<div id="login-area">
    <p style="color: #ccc; font-size: 0.8em;">[ DEBUG CONSOLE ]</p>
    <input type="password" id="passkey" placeholder="Init_Date" onkeypress="handleEnter(event)">
    <div id="error-msg">ACCESS DENIED</div>
</div>

<script>
    function handleEnter(e) {
        if (e.key === 'Enter') {
            const val = document.getElementById('passkey').value;
            // SNSページで見つけた日付がパスワード
            if (val === '20260710') {
                localStorage.setItem('auth', 'true');
                window.location.href = 'system.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('passkey').value = '';
            }
        }
    }
</script>

</body>
</html>
