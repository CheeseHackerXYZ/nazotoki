<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Environment Debugger</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            margin: 0; padding: 20px;
            overflow: hidden; /* スクロール禁止 */
            -webkit-user-select: none;
        }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel { background: #000; padding: 20px; border: 1px solid #333; border-radius: 5px; }
        
        /* カスタムタッチスライダー（ギミック） */
        .slider-container {
            width: 100%;
            height: 60px;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff);
            position: relative;
            margin-top: 40px;
            border-radius: 30px;
        }
        .knob {
            width: 60px;
            height: 60px;
            background: #fff;
            border: 4px solid #333;
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        #status { font-size: 1.2em; margin-top: 20px; font-weight: bold; color: #ff0000; }
    </style>
</head>
<body>

<script>
    // 直リンク防止のセキュリティ
    if (localStorage.getItem('auth') !== 'true') {
        window.location.href = 'index.html';
    }
</script>

<div class="panel">
    <h2>[ ADMIN ] 対象環境: HIKARU_World_#04</h2>
    <p>警告: 対象者の認識パラメーターに異常が設定されています。</p>
    <p>指示: 下部のスライダーを操作し、「Sky Hue（空の色彩）」を現実世界の正常値（BLUE領域）へ強制修正してください。</p>

    <div class="slider-container" id="track">
        <div class="knob" id="knob"></div>
    </div>
    
    <div id="status">現在値: RED (異常)</div>
</div>

<script>
    const knob = document.getElementById('knob');
    const track = document.getElementById('track');
    const statusText = document.getElementById('status');
    let isDragging = false;
    
    // iPad向けのタッチイベント
    knob.addEventListener('touchstart', (e) => {
        isDragging = true;
        e.preventDefault();
    });

    knob.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        
        const touch = e.touches[0];
        const trackRect = track.getBoundingClientRect();
        
        // スライダー内でのX座標を計算
        let x = touch.clientX - trackRect.left - 30; // 30はknobの半径
        
        // はみ出さないように制限
        const maxX = trackRect.width - 60;
        x = Math.max(0, Math.min(x, maxX));
        
        knob.style.left = x + 'px';
        
        // 割合（0.0 〜 1.0）の計算
        const ratio = x / maxX;
        
        if (ratio < 0.3) {
            statusText.innerText = "現在値: RED (異常)";
            statusText.style.color = "#ff0000";
        } else if (ratio < 0.7) {
            statusText.innerText = "現在値: GREEN (不安定)";
            statusText.style.color = "#00ff00";
        } else if (ratio > 0.85) {
            // 右端（青色）に到達した場合、デバッグ完了
            statusText.innerText = "現在値: BLUE (正常化完了)";
            statusText.style.color = "#0088ff";
            completeHack();
        }
    });

    knob.addEventListener('touchend', () => {
        isDragging = false;
    });

    function completeHack() {
        // イベントを削除して操作不能にする
        isDragging = false;
        
        // ★ARGの核：世界が書き換えられたフラグを保存
        localStorage.setItem('world_status', 'hacked');
        
        setTimeout(() => {
            alert("環境変数の書き換えに成功しました。対象者の認識が強制リセットされます。");
            // ブログに強制送還。そこで崩壊した世界を目の当たりにする
            window.location.href = 'index.html';
        }, 1000);
    }
</script>

</body>
</html>
